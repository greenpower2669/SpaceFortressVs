name: Android APK + AAB

on:
  push:
    paths-ignore:
      - todo.md
      - docs/delivery.md
    branches:
      - main
      - ui/start-screen-v1
      - fix/gameplay-campaign-200
      - fix/help-refresh-on-ci389-20261009
      - feature/solo-worlds-tutorials-v1
  pull_request:
    branches:
      - main
      - ui/start-screen-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solo-core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run isolated SOLO logic
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/solo_campaign_model_regressions.cpp tests/solo_map_generator_regressions.cpp tests/solo_session_regressions.cpp tests/solo_tutorial_challenges_regressions.cpp tests/solo_progression_regressions.cpp tests/solo_hall_regressions.cpp tests/solo_stage_selection_regressions.cpp tests/solo_campaign_controller_regressions.cpp tests/solo_progression_storage_regressions.cpp tests/solo_campaign_persistence_regressions.cpp tests/solo_combat_regressions.cpp tests/solo_canonical_adapter_regressions.cpp; do
            binary="$(mktemp)"
            g++ -std=c++17 -O1 -Wall -Wextra -I src "$source" -o "$binary"
            "$binary"
            rm -f "$binary"
          done

  solo-sdl2-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Compile and test touchscreen selector
        run: g++ -std=c++17 -O1 -I src tests/solo_selector_ui_regressions.cpp -o /tmp/solo-selector-test && /tmp/solo-selector-test
      - name: Build complete SOLO SDL2 prototype executable
        run: g++ -std=c++17 -O1 -Wall -Wextra -DSF_SOLO_STANDALONE -I src src/solo_prototype.cpp -o /tmp/spacefortress-solo-prototype $(sdl2-config --cflags --libs)
      - name: Check SOLO executable linked to SDL2
        run: test -x /tmp/spacefortress-solo-prototype && ldd /tmp/spacefortress-solo-prototype | grep -q SDL2
      - name: Verify SOLO runner links without defining a second main
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -I src -c src/solo_prototype.cpp -o /tmp/spacefortress-solo-runner.o $(sdl2-config --cflags)
          nm -C /tmp/spacefortress-solo-runner.o | grep -Fq 'runSoloPrototype()'
          if nm -C /tmp/spacefortress-solo-runner.o | grep -Fq ' T main'; then
            echo 'Unexpected second main entry point'
            exit 1
          fi

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read game version
        id: version
        run: python3 scripts/package-release.py --metadata >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 16 SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fetch pinned SDL2 dependencies
        shell: bash
        run: bash scripts/fetch-sdl.sh

      - name: Validate assets and runtime regressions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
          bash scripts/test-regressions.sh

      - name: Java Hall protocol tests without a game key
        shell: bash
        env:
          SPACEFORTRESS_HOF_API_KEY: ''
        run: |
          gradle -p android --stacktrace \
            :app:testDebugUnitTest \
            --tests com.greenpower2669.spacefortressvs.HallOfFameSyncProtocolTest \
            :app:compileDebugJavaWithJavac

      - name: Build local-only debug APK without a game key
        shell: bash
        env:
          SPACEFORTRESS_HOF_API_KEY: ''
        run: gradle -p android --stacktrace :app:assembleDebug

      - name: Verify Hall secret hygiene
        shell: bash
        env:
          SPACEFORTRESS_HOF_API_KEY: ${{ secrets.SPACEFORTRESS_HOF_API_KEY }}
        run: python3 scripts/check-hall-secret.py

      - name: Report Hall key configuration
        shell: bash
        env:
          SPACEFORTRESS_HOF_API_KEY: ${{ secrets.SPACEFORTRESS_HOF_API_KEY }}
        run: |
          if [ -n "$SPACEFORTRESS_HOF_API_KEY" ]; then
            echo "Hall API game key: configured for phone-test artifacts"
          else
            echo "Hall API game key: not configured; artifacts stay local/cache-only"
          fi

      - name: Build installable APK and app bundles
        shell: bash
        env:
          SPACEFORTRESS_HOF_API_KEY: ${{ secrets.SPACEFORTRESS_HOF_API_KEY }}
        run: |
          set +e
          gradle -p android --stacktrace \
            :app:assembleDebug \
            :app:bundleRelease 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > android-build.exit
          exit 0

      - name: Android build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-${{ steps.version.outputs.version }}-android-build-log
          path: |
            android-build.log
            android-build.exit
          if-no-files-found: warn

      - name: Check Android build result
        shell: bash
        run: exit "$(cat android-build.exit)"

      - name: Verify and name release files
        run: python3 scripts/package-release.py

      - name: Versioned APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui/start-screen-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: spacefortress-release-${{ needs.build-android.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android.outputs.artifact }}
          path: dist/release
      - name: Check transferred files
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - name: Publish versioned APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
