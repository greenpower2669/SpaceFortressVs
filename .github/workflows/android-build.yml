name: Android APK + AAB

on:
  push:
    branches:
      - main
      - ui/start-screen-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fetch pinned SDL2 dependencies
        shell: bash
        run: bash scripts/fetch-sdl.sh

      - name: Build installable APK and app bundles
        shell: bash
        run: |
          set +e
          gradle -p android --stacktrace \
            :app:assembleDebug \
            :app:bundleDebug \
            :app:bundleRelease 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > android-build.exit
          exit 0

      - name: Android build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-android-build-log
          path: |
            android-build.log
            android-build.exit
          if-no-files-found: error

      - name: Check Android build result
        shell: bash
        run: exit "$(cat android-build.exit)"

      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-APK-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: AAB debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-AAB-debug
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

      - name: AAB release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-AAB-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
