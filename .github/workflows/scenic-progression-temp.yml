name: scenic-progression-temp
on:
  push:
    branches: [fix/gameplay-campaign-200]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scenic-tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 2
      - name: Add RED tests only
        run: python3 scripts/scenic_progression_tdd.py red
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          g++ -std=c++17 -O1 -I src tests/scenic_mix_regressions.cpp -o /tmp/scenic-red >/tmp/scenic-red.log 2>&1
          code1=$?
          python3 tests/test_scenic_integration.py >/tmp/integration-red.log 2>&1
          code2=$?
          set -e
          cat /tmp/scenic-red.log
          cat /tmp/integration-red.log
          test "$code1" -ne 0
          test "$code2" -ne 0
          grep -Eq 'scenic_mix.hpp|No such file' /tmp/scenic-red.log
          echo RED_CONFIRMED
      - name: Implement scenic progression
        run: python3 scripts/scenic_progression_tdd.py green
      - name: Install native test dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
      - name: Run GREEN suite
        shell: bash
        run: |
          bash scripts/test-regressions.sh | tee /tmp/scenic-green.log
          grep -Fq 'PASS: linear shield and white dust share one core across duel and coop' /tmp/scenic-green.log
          python3 tests/test_scenic_integration.py
          echo GREEN_CONFIRMED
      - name: Sync FAB-Copilot records
        run: python3 scripts/scenic_progression_tdd.py records
      - name: Verify historical main and push final branch commit
        shell: bash
        run: |
          test "$(git hash-object src/main.cpp)" = "835059a0ecfe0f74708068b3259cad5db1cdb579"
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/scenic-progression-temp.yml scripts/scenic_progression_tdd.py
          git add src tests scripts brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md docs/superpowers/plans/2026-10-03-scenic-map-progression.md
          git commit -m 'feat: mix scenic maps across classic and campaign'
          git push origin HEAD:fix/gameplay-campaign-200
          echo "FINAL_SHA=$(git rev-parse HEAD)"
