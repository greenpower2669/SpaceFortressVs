          new='''static void sfDrawBoss(SDL_Renderer *renderer,SDL_Texture *atlas,int boss,tupl centre,float radius,float time,float hit=0,float dying=0,SDL_Color tint={255,255,255,255})\n{\n    if (!atlas) {sfCoopDisc(renderer,centre.x,centre.y,radius*.6f,{180,60,230,220});return;}\n    const auto vertices=sfBossVertices(atlas,boss,centre,radius,time,hit,dying,tint);'''
