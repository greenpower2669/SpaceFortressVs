name: Repair kinetic applicator

on:
  push:
    branches:
      - fix/gameplay-campaign-200
    paths:
      - .github/workflows/kinetic-bootstrap.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
      - name: Repair every YAML run block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/kinetic-apply.yml')
          lines=p.read_text().splitlines()
          out=[]
          inside=False
          for line in lines:
              if inside and line.startswith('      - name:'):
                  inside=False
              if line == '        run: |':
                  inside=True
                  out.append(line)
                  continue
              if inside and line.strip():
                  indent=len(line)-len(line.lstrip(' '))
                  if indent < 10:
                      line='          '+line
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/kinetic-apply.yml').read_text())
          assert 'jobs' in data and 'apply' in data['jobs']
          steps=data['jobs']['apply']['steps']
          assert [s.get('name') for s in steps if 'name' in s] == [
              'Checkout branch','RED then implement kinetic shield','Full native regression suite','Commit verified gameplay and remove applicator'
          ]
          print('VALID: repaired workflow has all four steps')
          PY
      - name: Upload repaired workflow
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-apply-repaired-v2
          path: .github/workflows/kinetic-apply.yml
          if-no-files-found: error