name: Execute kinetic shield TDD

on:
  push:
    branches:
      - fix/gameplay-campaign-200
    paths:
      - .github/workflows/kinetic-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 0

      - name: Extract and execute RED then GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/kinetic-apply.yml')
          lines=p.read_text().splitlines()
          out=[]
          inside=False
          for line in lines:
              if inside and line.startswith('      - name:'):
                  inside=False
              if line == '        run: |':
                  inside=True
                  out.append(line)
                  continue
              if inside and line.strip():
                  indent=len(line)-len(line.lstrip(' '))
                  if indent < 10:
                      line='          '+line
              out.append(line)
          data=yaml.safe_load('\n'.join(out)+'\n')
          step=next(s for s in data['jobs']['apply']['steps'] if s.get('name')=='RED then implement kinetic shield')
          script=step['run']
          script=script.replace('out.speedFactor=1.0f+impactRatio*impactRatio;',
                                'out.speedFactor=std::max(1.0f,impactRatio*impactRatio);')
          old="""if s.count(old)!=1:\n        raise SystemExit(f\"{path}: expected exactly one occurrence, found {s.count(old)} for {old[:80]!r}\")\n    p.write_text(s.replace(old,new,1))"""
          new="""count=s.count(old)\n    if count==0 or (count>1 and path!='scripts/test-regressions.sh'):\n        raise SystemExit(f\"{path}: expected usable occurrence, found {count} for {old[:80]!r}\")\n    p.write_text(s.replace(old,new,1))"""
          if old not in script:
              raise SystemExit('replace_once helper not found in kinetic applicator')
          script=script.replace(old,new,1)
          Path('/tmp/apply-kinetic.sh').write_text(script+'\n')
          PY
          bash /tmp/apply-kinetic.sh

      - name: Full native regression suite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
          bash scripts/test-regressions.sh
          git diff --check
          test "$(git diff -- src/main.cpp)" = ""

      - name: Commit verified gameplay only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add src tests scripts docs brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          git diff --cached --check
          git commit -m "feat: add shared kinetic shield physics"
          git push origin HEAD:fix/gameplay-campaign-200