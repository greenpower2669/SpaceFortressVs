name: Fab x15 dust APK

on:
  push:
    branches:
      - fix/gameplay-campaign-200
    paths:
      - .github/workflows/fab-dust-apk.yml

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout campaign branch
        uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 0

      - name: Verify gameplay SHA is present
        shell: bash
        run: |
          git merge-base --is-ancestor 23d0e3e1354dec2cadf7b40c7a4f10a8b751a585 HEAD
          grep -q 'SF_COOP_INCOMING_DAMAGE_MULTIPLIER = 15.0f' src/campaign_runtime.hpp

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 16 SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      # Important: validate Gradle wrappers BEFORE fetching SDL third_party.
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fetch pinned SDL2 dependencies
        shell: bash
        run: bash scripts/fetch-sdl.sh

      - name: Fresh full runtime regressions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
          bash scripts/test-regressions.sh | tee x15-regressions.log
          grep -q 'PASS: coop incoming damage is x15 and white/red dust economy is active for boss, special ammo and shields' x15-regressions.log

      - name: Build installable APK and AAB
        shell: bash
        run: |
          gradle -p android --stacktrace :app:assembleDebug :app:bundleRelease 2>&1 | tee android-build.log
          python3 scripts/package-release.py
          ls -lh dist/release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SpaceFortressVs-x15-dust-APK-AAB-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error

      - name: Record verified APK proof and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          code='23d0e3e1354dec2cadf7b40c7a4f10a8b751a585'
          run=os.environ['GITHUB_RUN_ID']
          proof=f'''\n\n### Preuve fraîche D-140-11 APK\nGameplay testé : `{code}`. Workflow `{run}` : régressions complètes GREEN puis build Android APK+AAB réussi. Artefact : `SpaceFortressVs-x15-dust-APK-AAB-{run}`. Le premier essai avait échoué uniquement sur la validation d'un wrapper Gradle tiers SDL téléchargé trop tôt ; l'ordre CI a été corrigé sans changement gameplay. Aucun merge `main`, aucune release ; validation téléphone reste à Fab.\n'''
          for name in ['brain.md','brainmap.md','debughistorical.md','ordres-de-mission.md']:
              p=Path(name);t=p.read_text()
              if f'Workflow `{run}`' not in t:
                  p.write_text(t+proof)
          p=Path('todo.md');t=p.read_text()
          t=t.replace('- [ ] CI fraîche + APK/AAB de test.',f'- [x] CI fraîche + APK/AAB de test sur `{code}`, workflow `{run}`.')
          if f'Workflow `{run}`' not in t:
              t+=proof
          p.write_text(t)
          PY
          git config user.name 'greenpower2669'
          git config user.email '80179295+greenpower2669@users.noreply.github.com'
          git rm .github/workflows/fab-dust-apk.yml
          git add brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          git commit -m 'docs: record verified x15 dust APK run [skip ci]'
          git push origin HEAD:fix/gameplay-campaign-200
