name: SOLO-023 build real edge sprite sheet
on:
  push:
    branches: [feature/solo-coop-core-v1]
    paths: [.github/workflows/solo-023-build-edge-atlas.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solo-023-edge-asset
  cancel-in-progress: false
jobs:
  create-art:
    if: github.repository == 'greenpower2669/SpaceFortressVs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/solo-coop-core-v1
          persist-credentials: true
          fetch-depth: 1
      - name: Generate 48 transparent edge-mask sprites reproducibly
        run: |
          set -euo pipefail
          python3 scripts/generate-solo-edge-atlas.py
          file assets/pict/solo/HabillageRebordsModeSolo.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('assets/pict/solo/HabillageRebordsModeSolo.png').read_bytes()
          assert p[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',p[16:24])==(1536,512)
          assert 100000 < len(p) < 1500000
          print('Real RGBA sprite atlas verified:',len(p),'bytes')
          PY
      - name: Commit generated atlas to SOLO branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/pict/solo/HabillageRebordsModeSolo.png
          if git diff --cached --quiet; then echo "Already generated"; exit 0; fi
          git commit -m "assets(solo): deterministic 48-sprite rocky edge atlas [SOLO-023]"
          git fetch origin feature/solo-coop-core-v1
          git rebase origin/feature/solo-coop-core-v1
          git push origin HEAD:refs/heads/feature/solo-coop-core-v1
