name: Kinetic balance v3 RED
on:
  push:
    branches: [fix/gameplay-campaign-200]
    paths:
      - tests/kinetic_balance_v3_regressions.cpp
      - tests/test_balance_v3_integration.py
      - .github/workflows/kinetic-balance-v3-red.yml
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify RED contract fails on old implementation
        run: |
          set +e
          python3 tests/test_balance_v3_integration.py >/tmp/py.log 2>&1
          py=$?
          g++ -std=c++17 -O1 -I src tests/kinetic_balance_v3_regressions.cpp -o /tmp/kinetic-v3 >/tmp/cpp.log 2>&1
          cc=$?
          if [ "$cc" -eq 0 ]; then /tmp/kinetic-v3 >>/tmp/cpp.log 2>&1; cc=$?; fi
          cat /tmp/py.log
          cat /tmp/cpp.log
          if [ "$py" -eq 0 ] && [ "$cc" -eq 0 ]; then
            echo 'RED unexpectedly passed'
            exit 1
          fi
          echo "Expected RED observed: python=$py cpp=$cc"
