name: Kinetic balance v3 legacy diagnostic
on:
  push:
    branches: [fix/gameplay-campaign-200]
    paths:
      - .github/workflows/kinetic-balance-v3-diagnostic.yml
permissions:
  contents: read
jobs:
  isolate-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
      - name: Apply candidate gameplay
        run: python3 scripts/apply-kinetic-balance-v3b.py
      - name: Prepare generated compatibility source
        run: |
          rm -rf "$RUNNER_TEMP/sf-reg"
          mkdir -p "$RUNNER_TEMP/sf-reg/resources/assets"
          python3 scripts/prepare-assets.py --output "$RUNNER_TEMP/sf-reg/resources/assets"
          (cd "$RUNNER_TEMP/sf-reg" && cmake -DREPO_ROOT="$GITHUB_WORKSPACE" -P "$GITHUB_WORKSPACE/scripts/prepare-legacy-source.cmake")
      - name: Compile legacy field regression binary
        run: |
          read -r -a CFLAGS <<< "$(pkg-config --cflags sdl2 SDL2_image SDL2_mixer)"
          read -r -a LIBS <<< "$(pkg-config --libs sdl2 SDL2_image SDL2_mixer)"
          g++ -std=c++17 -O1 -g -D_GLIBCXX_DEBUG -fsanitize=undefined -fno-sanitize-recover=all -ffunction-sections -fdata-sections -I src -I tests/include -I "$RUNNER_TEMP/sf-reg/generated" "${CFLAGS[@]}" tests/legacy_field_regressions.cpp -Wl,--gc-sections "${LIBS[@]}" -pthread -o "$RUNNER_TEMP/sf-reg/legacy-field-regressions"
      - name: Legacy visibility
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions visibility)
      - name: Legacy classic render
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions classic-render)
      - name: Legacy mining
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions mining)
      - name: Legacy trajectories
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions trajectories)
      - name: Legacy interactions
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions interactions)
      - name: Legacy full field
        run: (cd "$RUNNER_TEMP/sf-reg" && ./legacy-field-regressions full-field)
