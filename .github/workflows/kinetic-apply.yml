name: Apply kinetic shield TDD

on:
  push:
    branches:
      - fix/gameplay-campaign-200
    paths:
      - .github/workflows/kinetic-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 0

      - name: RED then implement kinetic shield
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/kinetic_regressions.cpp <<'CPP'
          #include <cassert>
          #include <cmath>
          #include "kinetic_shield.hpp"
          int main() {
              const float ref=sfKineticReferenceSpeed(780.0f);
              const auto headOn=sfResolveKinetic(100.0f,1.0f,{0,300},{0,-200},0,-1,ref);
              const auto fleeing=sfResolveKinetic(100.0f,1.0f,{0,300},{0,200},0,-1,ref);
              assert(std::abs(headOn.impactSpeed-500.0f)<.001f);
              assert(std::abs(fleeing.impactSpeed-100.0f)<.001f);
              assert(headOn.rawDamage>fleeing.rawDamage);
              const auto still=sfResolveKinetic(100.0f,2.0f,{0,0},{0,0},0,-1,ref);
              assert(std::abs(still.speedFactor-1.0f)<.001f && std::abs(still.rawDamage-200.0f)<.001f);
              const auto tangent=sfResolveKinetic(100.0f,1.0f,{500,0},{0,0},0,-1,ref);
              assert(tangent.impactSpeed==0 && tangent.relativeSpeed>499 && tangent.suggestedLayer==SfKineticLayer::Outer);
              const auto outer=sfApplyKineticLayer(headOn,SfKineticLayer::Outer,1.0f,15.0f);
              const auto inner=sfApplyKineticLayer(headOn,SfKineticLayer::Inner,1.0f,15.0f);
              const auto empty=sfApplyKineticLayer(headOn,SfKineticLayer::Outer,0.0f,15.0f);
              assert(outer.residualDamage<inner.residualDamage && outer.heatCost>0 && outer.heatCost<=4.0f);
              assert(empty.dissipatedDamage==0 && empty.heatCost==0 && std::abs(empty.residualDamage-headOn.rawDamage)<.001f);
              assert(sfKineticBossMass(199)>sfKineticBossMass(0));
              assert(sfHullRegenPerSecond(0)>sfHullRegenPerSecond(25));
              assert(sfHullRegenPerSecond(25)>sfHullRegenPerSecond(50));
              assert(std::abs(sfHullRegenPerSecond(0)-24.0f)<.01f);
              return 0;
          }
          CPP
          if g++ -std=c++17 -I src /tmp/kinetic_regressions.cpp -o /tmp/kinetic-red 2>/tmp/kinetic-red.log; then
            echo "RED gate failed: kinetic core unexpectedly existed"
            exit 1
          fi
          grep -Eq "kinetic_shield.hpp|No such file" /tmp/kinetic-red.log
          echo "RED confirmed: kinetic core missing"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {s.count(old)} for {old[:80]!r}")
              p.write_text(s.replace(old,new,1))

          def insert_before(path, marker, block):
              p=Path(path); s=p.read_text()
              if s.count(marker)!=1:
                  raise SystemExit(f"{path}: marker count {s.count(marker)} for {marker[:80]!r}")
              p.write_text(s.replace(marker,block+marker,1))

          kinetic = r'''#pragma once
#include <algorithm>
#include <array>
#include <cmath>

// Shared kinetic model for duel and campaign. Velocities are pixels/second.
// Kinetic damage is mass * velocity^2, normalized around the historical rock
// damage so a nearly stationary rock still has a non-zero mass-only impact.
constexpr float SF_KINETIC_COOP_DAMAGE_MULTIPLIER = 15.0f;
constexpr float SF_KINETIC_OUTER_SPEED_RATIO = 1.35f;
constexpr float SF_KINETIC_INNER_SPEED_RATIO = .55f;
constexpr float SF_KINETIC_OUTER_DISSIPATION = .94f;
constexpr float SF_KINETIC_INNER_DISSIPATION = .78f;
constexpr float SF_KINETIC_OUTER_RADIUS_DIAMETERS = 2.0f;
constexpr float SF_KINETIC_INNER_RADIUS_DIAMETERS = 1.25f;
constexpr float SF_KINETIC_BOSS_BASE_DAMAGE = 50.0f;

struct SfKineticVector { float x=0,y=0; };
enum class SfKineticLayer { None, Inner, Outer };
struct SfKineticSolution {
    SfKineticLayer suggestedLayer=SfKineticLayer::None;
    SfKineticLayer appliedLayer=SfKineticLayer::None;
    float relativeSpeed=0,impactSpeed=0,tangentSpeed=0;
    float massFactor=0,speedFactor=1,rawDamage=0;
    float dissipationFraction=0,dissipatedDamage=0,residualDamage=0,heatCost=0;
};
struct SfKineticPulseState { float outer=0,inner=0,phase=0; };
inline std::array<SfKineticPulseState,2> sfKineticPulses{};

static float sfKineticReferenceSpeed(float arenaWidth)
{
    return std::max(1.0f,arenaWidth*.30f);
}
static float sfKineticReferenceArea(float arenaHeight)
{
    return std::max(1.0f,arenaHeight*arenaHeight*.008f);
}
static float sfKineticMassFactorFromArea(float area,float arenaHeight)
{
    return std::max(0.0f,area)/sfKineticReferenceArea(arenaHeight);
}
static float sfKineticBossMass(int encounter)
{
    const float p=std::clamp(encounter/199.0f,0.0f,1.0f);
    return 1.0f+1.8f*std::pow(p,1.25f);
}
static float sfKineticEnergyFraction(float heat)
{
    if (std::isnan(heat)) return 0;
    return 1.0f-std::clamp(heat/50.0f,0.0f,1.0f);
}
static float sfHullRegenPerSecond(float heat)
{
    const float energy=sfKineticEnergyFraction(heat);
    const float x=std::clamp((energy-.90f)/.10f,0.0f,1.0f);
    const float perfect=x*x*(3.0f-2.0f*x);
    return 6.0f*energy*energy+18.0f*perfect;
}
static SfKineticSolution sfResolveKinetic(float baseDamage,float massFactor,
                                          SfKineticVector objectVelocity,
                                          SfKineticVector shipVelocity,
                                          float normalX,float normalY,
                                          float referenceSpeed)
{
    SfKineticSolution out;
    const float nx=normalX,ny=normalY;
    const float nlen=std::sqrt(nx*nx+ny*ny);
    const float ux=nlen>.0001f ? nx/nlen : 0;
    const float uy=nlen>.0001f ? ny/nlen : -1;
    const float rvx=objectVelocity.x-shipVelocity.x;
    const float rvy=objectVelocity.y-shipVelocity.y;
    out.relativeSpeed=std::sqrt(rvx*rvx+rvy*rvy);
    out.impactSpeed=std::max(0.0f,-(rvx*ux+rvy*uy));
    out.tangentSpeed=std::sqrt(std::max(0.0f,out.relativeSpeed*out.relativeSpeed-out.impactSpeed*out.impactSpeed));
    referenceSpeed=std::max(1.0f,referenceSpeed);
    const float impactRatio=out.impactSpeed/referenceSpeed;
    const float relativeRatio=out.relativeSpeed/referenceSpeed;
    out.massFactor=std::max(0.0f,massFactor);
    out.speedFactor=1.0f+impactRatio*impactRatio;
    out.rawDamage=std::max(0.0f,baseDamage)*out.massFactor*out.speedFactor;
    out.residualDamage=out.rawDamage;
    out.suggestedLayer=relativeRatio>=SF_KINETIC_OUTER_SPEED_RATIO ? SfKineticLayer::Outer :
                       relativeRatio>=SF_KINETIC_INNER_SPEED_RATIO ? SfKineticLayer::Inner : SfKineticLayer::None;
    return out;
}
static SfKineticSolution sfApplyKineticLayer(SfKineticSolution out,SfKineticLayer layer,
                                              float energyFraction,float damageMultiplier=1.0f)
{
    energyFraction=std::clamp(energyFraction,0.0f,1.0f);
    const float maximum=layer==SfKineticLayer::Outer ? SF_KINETIC_OUTER_DISSIPATION :
                        layer==SfKineticLayer::Inner ? SF_KINETIC_INNER_DISSIPATION : 0.0f;
    out.appliedLayer=layer;
    out.dissipationFraction=std::clamp(maximum*energyFraction,0.0f,.97f);
    out.dissipatedDamage=out.rawDamage*out.dissipationFraction;
    out.residualDamage=out.rawDamage-out.dissipatedDamage;
    if (out.dissipatedDamage>0) {
        const float weighted=out.dissipatedDamage*std::max(0.0f,damageMultiplier);
        out.heatCost=std::min(4.0f,.04f+weighted*.002f);
    }
    return out;
}
static void sfKineticTriggerPulse(int owner,SfKineticLayer layer,float strength=1.0f)
{
    if (owner<0 || owner>1) return;
    strength=std::clamp(strength,0.0f,1.0f);
    if (layer==SfKineticLayer::Outer) sfKineticPulses[owner].outer=std::max(sfKineticPulses[owner].outer,strength);
    if (layer==SfKineticLayer::Inner) sfKineticPulses[owner].inner=std::max(sfKineticPulses[owner].inner,strength);
}
'''
          Path('src/kinetic_shield.hpp').write_text(kinetic)
          Path('tests/kinetic_regressions.cpp').write_text(Path('/tmp/kinetic_regressions.cpp').read_text())

          ship_energy = r'''#pragma once
#include <algorithm>
#include <cmath>
#include "kinetic_shield.hpp"

// Historical nrj measures spent energy/heat: 0 is full, 50 is exhausted.
// Clamp mutations as well as the display; an impact must not create an
// unbounded reserve deficit that firing then silently erases.
constexpr float SF_MAX_SHIP_HEAT = 50.0f;

static float sfShipHeat(float heat)
{
    return std::isnan(heat) ? SF_MAX_SHIP_HEAT : std::clamp(heat,0.0f,SF_MAX_SHIP_HEAT);
}

static void sfAddShipHeat(sprite *ship,float amount)
{
    ship->nrj=sfShipHeat(sfShipHeat(ship->nrj)+amount);
}

static SDL_Rect sfEnergyMarkerRect(float heat,SDL_Rect full,const SDL_Rect &gun)
{
    const float spent=sfShipHeat(heat)/SF_MAX_SHIP_HEAT;
    const float gunX=gun.x+(gun.w-full.w)*.5f;
    const float gunY=gun.y+(gun.h-full.h)*.5f;
    full.x=std::lround(full.x+(gunX-full.x)*spent);
    full.y=std::lround(full.y+(gunY-full.y)*spent);
    return full;
}

static bool sfSpendMainEnergy(sprite *ship)
{
    sfAddShipHeat(ship,1);
    const bool missile=ship->nrj<1.5f;
    if (missile) sfAddShipHeat(ship,10);
    return missile;
}
static float sfShieldSpent(float heat)
{
    return sfShipHeat(heat)/SF_MAX_SHIP_HEAT;
}
static float sfShieldFraction(float heat)
{
    return 1.0f-sfShieldSpent(heat);
}
static float sfShieldDamage(float damage,float heat)
{
    return std::max(0.0f,damage)*sfShieldSpent(heat);
}
static float sfShieldWear(float damage,float heat)
{
    const float factor=std::clamp(.1f+sfShieldSpent(heat),.1f,1.0f);
    return std::max(0.0f,damage)*factor;
}
static float sfApplyShieldImpact(sprite *ship,float incomingDamage)
{
    if (!ship || incomingDamage<=0) return 0;
    const float heatBefore=sfShipHeat(ship->nrj);
    const float hullDamage=sfShieldDamage(incomingDamage,heatBefore);
    sfAddShipHeat(ship,sfShieldWear(incomingDamage,heatBefore));
    return hullDamage;
}
static float sfApplyShieldContinuousImpact(sprite *ship,float incomingPerSecond,float dt)
{
    if (!ship || incomingPerSecond<=0 || dt<=0) return 0;
    constexpr float step=1.0f/240.0f;
    float remaining=dt,total=0;
    while (remaining>1e-6f) {
        const float slice=std::min(step,remaining);
        total+=sfApplyShieldImpact(ship,incomingPerSecond*slice);
        remaining-=slice;
    }
    return total;
}
static void sfRegenerateHull(sprite *ship,float dt)
{
    if (!ship || ship->pv<=0 || ship->pv>=1000 || dt<=0) return;
    ship->pv=std::min(1000.0f,ship->pv+sfHullRegenPerSecond(sfShipHeat(ship->nrj))*dt);
}
'''
          Path('src/ship_energy.hpp').write_text(ship_energy)

          replace_once('src/t.hpp','bool defensiveShot=false;\n   int shotOwner=-1;',
                       'bool defensiveShot=false;\n   int kineticStage=0; // 0 outside, 1 past outer field, 2 past inner field.\n   int shotOwner=-1;')

          field = r'''#pragma once

// One bounded, fixed-step owner for Fab's sprite field. Asteroids now meet a
// shared two-layer kinetic field before the historical energy shield/hull path.
static void sfFieldImpact(sprite *a,sprite *b,bool rocks=false)
{
    if(explos.size()>=256) return;
    explos.push_back(new eexpl("pous",xymr(a->x,b->x,a->w,b->w),xymr(a->y,b->y,a->h,b->h),
        rocks ? (a->h+a->w+b->h+b->w)/2 : sfArenaH/40,
        rocks ? (a->h+a->w+b->h+b->w)/8 : (a->h+a->w)/4,
        (a->vx+b->vx)*.1f,(a->vy+b->vy)*.1f));
}
static void sfMineAsteroid(sprite *rock,sprite *shot)
{
    if (rock->pv<=0 || shot->pv<=0) return;
    partsforiw(rock,shot);
    sfFieldMiningSound=true;
    sfFieldImpact(rock,shot);
    const float cm=sfArenaH/1000.0f;
    rock->w=std::max(0.0f,rock->w-cm);rock->h=std::max(0.0f,rock->h-cm);
    rock->sw=rock->w;rock->sh=rock->h;rock->startup();shot->pv=0;
    if (rock->w<sfArenaH/100) rock->pv=0;
}
static float sfKineticSegmentDistance(float ax,float ay,float bx,float by,float px,float py)
{
    const float dx=bx-ax,dy=by-ay,length=dx*dx+dy*dy;
    const float t=length>.0001f ? std::clamp(((px-ax)*dx+(py-ay)*dy)/length,0.0f,1.0f) : 0;
    return vlong(ax+dx*t-px,ay+dy*t-py);
}
static float sfKineticShipDiameter(const sprite *ship)
{
    return std::max(1.0f,std::max({ship->sw,ship->sh,ship->w,ship->h}));
}
static SfKineticSolution sfKineticRockSolution(const sprite *rock,const sprite *ship,int owner)
{
    const float dx=rock->x-ship->x,dy=rock->y-ship->y,d=std::max(1.0f,vlong(dx,dy));
    const float area=std::max(1.0f,rock->w*rock->h);
    const float refArea=sfKineticReferenceArea(sfArenaH);
    return sfResolveKinetic(refArea*.05f,sfKineticMassFactorFromArea(area,sfArenaH),
        {rock->vx*60.0f,rock->vy*60.0f},{sfObserved[owner].velocity.vx,sfObserved[owner].velocity.vy},
        dx/d,dy/d,sfKineticReferenceSpeed(sfArenaW));
}
static void sfKineticEmitRedDust(int owner,int count,float ring)
{
    if(owner<0 || owner>1 || count<=0) return;
    auto *ship=owner==0 ? Spritej1 : Spritej2;
    for(int i=0;i<count && particulesr.size()<1000;++i) {
        const float a=(i+.5f)*2*float(PI)/count+owner*.41f;
        auto *dust=new parts(ship->x+std::cos(a)*ring,ship->y+std::sin(a)*ring);
        dust->pv=600;
        dust->vx=std::cos(a)*sfArenaW*.72f;
        dust->vy=std::sin(a)*sfArenaW*.72f;
        particulesr.push_back(dust);
    }
}
static void sfKineticUpdateEffects(float dt)
{
    for(int owner=0;owner<2;++owner) {
        auto &pulse=sfKineticPulses[owner];pulse.phase+=dt*34.0f;
        pulse.outer=std::max(0.0f,pulse.outer-dt/0.42f);
        pulse.inner=std::max(0.0f,pulse.inner-dt/0.34f);
        const auto *ship=owner==0 ? Spritej1 : Spritej2;
        if(!ship || ship->pv<=0) continue;
        const float diameter=sfKineticShipDiameter(ship);
        for(auto *dust:particulesr) {
            if(!dust || dust->pv<=0) continue;
            const float dx=dust->x-ship->x,dy=dust->y-ship->y,d=std::max(1.0f,vlong(dx,dy));
            float strength=0;
            if(pulse.outer>0 && std::abs(d-diameter*SF_KINETIC_OUTER_RADIUS_DIAMETERS)<diameter*.10f) strength=pulse.outer;
            if(pulse.inner>0 && std::abs(d-diameter*SF_KINETIC_INNER_RADIUS_DIAMETERS)<diameter*.09f) strength=std::max(strength,pulse.inner);
            if(strength<=0) continue;
            const float wobble=std::sin(pulse.phase+d*.08f)*diameter*.018f*strength;
            dust->x+=(-dy/d)*wobble;dust->y+=(dx/d)*wobble;
        }
    }
}
static bool sfKineticFragmentRock(sprite *rock,const sprite *ship,int owner,SfKineticLayer layer,
                                  const SfKineticSolution &solution)
{
    if(!rock || rock->pv<=0 || !ship) return false;
    const int count=layer==SfKineticLayer::Outer ? 6 : 4;
    const int nextStage=layer==SfKineticLayer::Outer ? 1 : 2;
    const float scale=1.0f/std::sqrt(float(count));
    const float smallest=sfArenaH/260.0f;
    if(std::max(rock->w,rock->h)*scale<smallest) {rock->pv=0;return true;}
    if(sa1.size()+count>200) return false;
    const float shipVx=sfObserved[owner].velocity.vx,shipVy=sfObserved[owner].velocity.vy;
    const float relX=rock->vx*60.0f-shipVx,relY=rock->vy*60.0f-shipVy;
    const float baseAngle=std::atan2(relY,relX);
    const float retained=std::sqrt(std::clamp(solution.residualDamage/std::max(.001f,solution.rawDamage),.02f,1.0f));
    const int penetrators=std::max(1,int(std::ceil(count*std::clamp(1.0f-solution.dissipationFraction,0.05f,.55f))));
    for(int i=0;i<count;++i) {
        auto *fragment=new sprite;
        const float fw=std::max(2.0f,rock->w*scale),fh=std::max(2.0f,rock->h*scale);
        fragment->setxywh(rock->x,rock->y,fw,fh);fragment->sw=fw;fragment->sh=fh;
        fragment->pv=1;fragment->name=rock->name;fragment->timer=1;fragment->kineticStage=nextStage;
        float angle;
        if(i<penetrators) angle=baseAngle+(i-(penetrators-1)*.5f)*.16f;
        else {
            const float side=(i&1) ? 1.0f : -1.0f;
            angle=baseAngle+side*(.72f+.25f*(i-penetrators));
        }
        const float relSpeed=solution.relativeSpeed*retained*(i<penetrators ? .82f : .62f);
        fragment->vx=(shipVx+std::cos(angle)*relSpeed)/60.0f;
        fragment->vy=(shipVy+std::sin(angle)*relSpeed)/60.0f;
        fragment->startup();sa1.push_back(fragment);
    }
    rock->pv=0;return true;
}
static bool sfKineticTryLayer(sprite *rock,sprite *ship,int owner,SfKineticLayer layer,
                              const SfKineticSolution &raw,float damageMultiplier)
{
    const auto solved=sfApplyKineticLayer(raw,layer,sfKineticEnergyFraction(ship->nrj),damageMultiplier);
    if(solved.dissipationFraction<=.001f) return false;
    sfAddShipHeat(ship,solved.heatCost);
    sfKineticTriggerPulse(owner,layer,std::clamp(.35f+solved.dissipationFraction,0.0f,1.0f));
    const float diameter=sfKineticShipDiameter(ship);
    sfKineticEmitRedDust(owner,layer==SfKineticLayer::Outer ? 7 : 4,
        diameter*(layer==SfKineticLayer::Outer ? SF_KINETIC_OUTER_RADIUS_DIAMETERS : SF_KINETIC_INNER_RADIUS_DIAMETERS));
    if(sfKineticFragmentRock(rock,ship,owner,layer,solved)) return true;
    // Population cap fallback: preserve the object but shed kinetic speed and
    // turn it sideways rather than deleting matter or tunnelling through.
    const float dx=rock->x-ship->x,dy=rock->y-ship->y,d=std::max(1.0f,vlong(dx,dy));
    const float retained=std::sqrt(std::clamp(solved.residualDamage/std::max(.001f,solved.rawDamage),.02f,1.0f));
    const float wx=rock->vx*retained,wy=rock->vy*retained;
    rock->vx=(-dy/d)*vlong(wx,wy)*(owner ? -1.0f : 1.0f);rock->vy=(dx/d)*vlong(wx,wy)*(owner ? -1.0f : 1.0f);
    rock->kineticStage=layer==SfKineticLayer::Outer ? 1 : 2;
    return false;
}

static void sfLegacyFieldStep(void (*hurt)(int,float))
{
    if (sa1.empty()) {setastswall();setasts(2);}
    else if (sa1.size()<8) setasts(2);
    std::vector<sprite*> rocks(sa1.begin(),sa1.end());
    for (auto *rock:rocks) {
        if (rock->pv<=0) continue;
        const float fromX=rock->x,fromY=rock->y;
        rock->ast();
        rock->tout=inxy(rock) ? 0 : rock->tout+1;
        if (rock->tout>60*30) rock->pv=0;
        for (int owner=0;owner<2 && rock->pv>0;++owner) {
            auto *ship=owner==0 ? Spritej1 : Spritej2;
            if (ship->pv<=0) continue;
            const float diameter=sfKineticShipDiameter(ship),rockRadius=std::max(rock->w,rock->h)*.5f;
            const float outer=diameter*SF_KINETIC_OUTER_RADIUS_DIAMETERS+rockRadius;
            const float inner=diameter*SF_KINETIC_INNER_RADIUS_DIAMETERS+rockRadius;
            const auto raw=sfKineticRockSolution(rock,ship,owner);
            const float multiplier=hurt ? SF_KINETIC_COOP_DAMAGE_MULTIPLIER : 1.0f;
            if(rock->kineticStage==0 && raw.suggestedLayer==SfKineticLayer::Outer &&
               sfKineticSegmentDistance(fromX,fromY,rock->x,rock->y,ship->x,ship->y)<=outer) {
                rock->kineticStage=1;
                if(sfKineticTryLayer(rock,ship,owner,SfKineticLayer::Outer,raw,multiplier)) continue;
            }
            if(rock->pv<=0) continue;
            if(rock->kineticStage<2 && raw.suggestedLayer!=SfKineticLayer::None &&
               sfKineticSegmentDistance(fromX,fromY,rock->x,rock->y,ship->x,ship->y)<=inner) {
                rock->kineticStage=2;
                if(sfKineticTryLayer(rock,ship,owner,SfKineticLayer::Inner,raw,multiplier)) continue;
            }
            if(rock->pv<=0) continue;
            const float hullRadius=std::max(ship->sw,ship->sh)*.52f+rockRadius;
            const bool hullHit=colee(ship,rock) ||
                sfKineticSegmentDistance(fromX,fromY,rock->x,rock->y,ship->x,ship->y)<=hullRadius;
            if(!hullHit) continue;
            sfFieldCollisionSound=true;sfFieldImpact(rock,ship);
            sfKineticTriggerPulse(owner,SfKineticLayer::Inner,.42f);
            sfKineticEmitRedDust(owner,3,diameter*.62f);
            if (hurt) hurt(owner,raw.rawDamage);
            else ship->pv=std::max(0.0f,ship->pv-sfApplyShieldImpact(ship,raw.rawDamage));
            rock->pv=0;
        }
    }
    for(size_t i=0;i<rocks.size();++i) {
        auto *a=rocks[i];
        for(size_t j=i+1;j<rocks.size() && a->pv>0;++j) {
            auto *b=rocks[j];
            if (b->pv<=0 || a->timer || b->timer || !(inxy(a)||inxy(b)) || !colee(a,b)) continue;
            partsforiw(a,b);sfFieldCollisionSound=true;sfFieldImpact(a,b,true);
            const float h1=std::sqrt(a->w*a->h),h2=std::sqrt(b->w*b->h);
            if (std::min(h1,h2)>0 && std::max(h1,h2)/std::min(h1,h2)<1.05f) {
                for(int burst=0;burst<4 && sa1.size()+4<=200;++burst) eclats(a,b);
                a->pv=b->pv=0;
            } else {
                auto *large=h1>h2 ? a : b;auto *small=h1>h2 ? b : a;
                large->w+=small->w*.01f;large->h+=small->h*.01f;
