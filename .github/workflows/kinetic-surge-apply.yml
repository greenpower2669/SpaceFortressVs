name: Kinetic surge APPLY

on:
  push:
    branches:
      - fix/gameplay-campaign-200
    paths:
      - .github/workflows/kinetic-surge-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Apply kinetic surge implementation
        run: |
          set -euo pipefail
          python3 scripts/apply-kinetic-surge.py

      - name: Targeted GREEN tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -I src tests/kinetic_surge_regressions.cpp -o /tmp/kinetic-surge
          /tmp/kinetic-surge
          python3 tests/test_kinetic_surge_integration.py

      - name: Full native regressions
        run: |
          set -euo pipefail
          bash scripts/test-regressions.sh
          test "$(git hash-object src/main.cpp)" = "835059a0ecfe0f74708068b3259cad5db1cdb579"
          git diff --check

      - name: Commit verified gameplay
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add src/kinetic_shield.hpp src/legacy_field_runtime.hpp src/tactical_runtime.hpp src/remaster_runtime.hpp src/campaign_runtime.hpp
          git add tests/restoration_regressions.hpp scripts/test-regressions.sh
          git add brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          git commit -m "feat: add two-finger kinetic surge in both modes"
          git push origin HEAD:fix/gameplay-campaign-200
