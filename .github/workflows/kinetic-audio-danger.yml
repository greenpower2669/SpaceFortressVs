name: Kinetic audio danger GREEN
on:
  push:
    branches: [fix/gameplay-campaign-200]
    paths:
      - scripts/apply-kinetic-audio-danger.py
      - scripts/patch-kinetic-audio-restoration-tests.py
      - tests/test_kinetic_integration.py
      - .github/workflows/kinetic-audio-danger.yml
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install native SDL regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
      - name: Apply GREEN implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-kinetic-audio-danger.py')
          t=p.read_text()
          old="assert hashlib.sha1(main).hexdigest()=='835059a0ecfe0f74708068b3259cad5db1cdb579'"
          new="assert hashlib.sha1(b'blob '+str(len(main)).encode()+b'\\0'+main).hexdigest()=='835059a0ecfe0f74708068b3259cad5db1cdb579'"
          assert old in t
          p.write_text(t.replace(old,new))
          PY
          python3 scripts/apply-kinetic-audio-danger.py
          python3 scripts/patch-kinetic-audio-restoration-tests.py
      - name: Targeted kinetic surge GREEN
        run: |
          python3 tests/test_kinetic_surge_integration.py
          g++ -std=c++17 -O1 -I src tests/kinetic_surge_regressions.cpp -o /tmp/kinetic-surge
          /tmp/kinetic-surge
      - name: Full native regression suite
        run: bash scripts/test-regressions.sh
      - name: Verify historical source and WAVs
        run: |
          test "$(git hash-object src/main.cpp)" = "835059a0ecfe0f74708068b3259cad5db1cdb579"
          python3 - <<'PY'
          import wave
          from pathlib import Path
          expected={'kinetic_charge.wav':(1.95,2.05),'kinetic_ready.wav':(.18,.32),'kinetic_release.wav':(.65,1.0)}
          for name,(lo,hi) in expected.items():
              p=Path('assets/sounds')/name
              with wave.open(str(p),'rb') as w:
                  seconds=w.getnframes()/w.getframerate()
                  assert w.getsampwidth()==2 and w.getnchannels()==1 and lo<=seconds<=hi,(name,seconds)
              print(name,round(seconds,3),'s')
          PY
      - name: Commit gameplay and clean applicator
        run: |
          rm -f scripts/apply-kinetic-audio-danger.py scripts/patch-kinetic-audio-restoration-tests.py .github/workflows/kinetic-audio-danger.yml
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add kinetic charge audio and boss danger selector"
          git push origin HEAD:fix/gameplay-campaign-200
