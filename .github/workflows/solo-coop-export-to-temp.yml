name: Export verified SOLO PHYSICS-017 to temp

on:
  push:
    branches: [feature/solo-coop-core-v1]
    paths: [.github/workflows/solo-coop-export-to-temp.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coop-solo-temp-export
  cancel-in-progress: false

jobs:
  unpack-verified-files:
    if: github.repository == 'greenpower2669/SpaceFortressVs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SOLO branch
        uses: actions/checkout@v4
        with:
          ref: feature/solo-coop-core-v1
          persist-credentials: true

      - name: Require exact GREEN PHYSICS-017 CI and unpack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=38956636032
          source_sha=3ef362cd1375034519c458a0effb2d7abef03490
          short_sha=3ef362c
          source_dir="$RUNNER_TEMP/solo-physics-017"
          mkdir -p "$source_dir"

          gh run watch "$source_run" --repo "$GITHUB_REPOSITORY" --exit-status
          conclusion="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          actual_sha="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [[ "$conclusion" == success && "$actual_sha" == "$source_sha" ]] || {
            echo "::error::PHYSICS-017 source CI is not the required GREEN commit"
            exit 1
          }

          gh run download "$source_run" --repo "$GITHUB_REPOSITORY"             --name SpaceFortressVs-1.4.2-release-files --dir "$source_dir"
          (cd "$source_dir" && sha256sum --check SHA256SUMS)

          python3 - "$source_dir" "$source_sha" "$short_sha" "$source_run" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          source_sha = sys.argv[2]
          short_sha = sys.argv[3]
          source_run = int(sys.argv[4])
          destination = Path("temp/solo-physics-017")
          destination.mkdir(parents=True, exist_ok=True)
          prefix = f"SpaceFortressVs-1.4.2-SOLO-PHYSICS-017-{short_sha}"

          source_manifest = json.loads((source / "SpaceFortressVs-1.4.2-build.json").read_text())
          assert source_manifest["commit"] == source_sha
          assert source_manifest["packageName"] == "com.greenpower2669.spacefortressvs.diagnostic"

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          delivered = {}
          pairs = [
              ("SpaceFortressVs-1.4.2.apk", prefix + ".apk"),
              ("SpaceFortressVs-1.4.2-unsigned.aab", prefix + "-unsigned.aab"),
          ]
          for original_name, target_name in pairs:
              original = source / original_name
              assert original.is_file() and original.stat().st_size > 0
              sha = digest(original)
              assert sha == source_manifest["files"][original_name]["sha256"]
              target = destination / target_name
              if target.exists():
                  assert digest(target) == sha, "Refuse to replace a different diagnostic"
              else:
                  shutil.copy2(original, target)
              delivered[target_name] = {"sha256": sha, "size": target.stat().st_size}

          atlas = Path("assets/pict/solo/SoloBonusAnimations.png")
          assert atlas.is_file()
          atlas_sha = digest(atlas)
          assert atlas_sha == "1a337adb15a6a3901b76da566dcd26a1d2d76c26893864a37a85e97b63950001"

          parallax = Path("assets/pict/solo/FondsParallaxeModeSolo.png")
          parallax_sha = digest(parallax)
          assert parallax_sha == "4becaec70bf7f23d823c3eccbd902b86aa4dbb6942115a1389409bc6a7f7df44"

          manifest = {
              "mission": "SOLO PHYSICS-017",
              "branch": "feature/solo-coop-core-v1",
              "commit": source_sha,
              "sourceRun": source_run,
              "packageName": source_manifest["packageName"],
              "animationAtlas": {
                  "path": str(atlas),
                  "layout": "4x8 frames, 192x192",
                  "sha256": atlas_sha,
              },
              "parallaxAtlas": {"path": str(parallax), "sha256": parallax_sha,
                                "width": 1254, "height": 1254, "alpha": True},
              "files": delivered,
              "aabNote": "NON SIGNE; diagnostic phone is the APK debug; no public Release.",
          }
          manifest_path = destination / (prefix + "-build.json")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          sums = [f"{meta['sha256']}  {name}" for name, meta in delivered.items()]
          sums.append(f"{digest(manifest_path)}  {manifest_path.name}")
          (destination / "SHA256SUMS").write_text("\n".join(sums) + "\n")

          evidence_lines = [
              f"Source `{source_sha}`; CI Android/C++/SDL2 `{source_run}` SUCCESS; publish-release SKIPPED.",
              f"- Atlas animé: `assets/pict/solo/SoloBonusAnimations.png`, 1536x768, 4x8 frames de 192 px, SHA256 `{atlas_sha}`.",
              f"- Fond ajouré : `{parallax}`, RGBA1254x1254, SHA256 `{parallax_sha}`.",
              *[f"- `{name}`: {meta['size']} octets, SHA256 `{meta['sha256']}`." for name, meta in delivered.items()],
          ]
          evidence = "\n".join(evidence_lines)

          report = Path("docs/solo-physics-017.md")
          report.write_text(report.read_text().replace(
              "État : implémentation et vérification technique en cours ; Samsung non validé.",
              "État : vérification technique C++/SDL2/Android réussie ; Samsung non validé."))
          plan = Path("docs/superpowers/plans/2026-10-16-solo-physics-017.md")
          plan_text = plan.read_text()
          task_four = plan_text.index("## Tâche 4")
          plan.write_text(plan_text[:task_four] + plan_text[task_four:].replace("- [ ]", "- [x]"))
          readme = "# SpaceFortress — SOLO PHYSICS-017 (DIAGNOSTIC)\n\n" + evidence + "\n\n" + report.read_text()
          (destination / "README.md").write_text(readme)

          marker = "## PHYSICS-017 — livraison vérifiée 16/10/2026"
          additions = {
              "brain.md": "PHYSICS-017 livré pour essai Samsung : inertie réelle Danger9, caméra après relâchement, zoom sélectionné ×1..×2, gisements stables, météores d'arène contrôlés, 10–12 miniboss avec chasse/meute et sons visibles uniquement. Gameplay et PARALLAX-016 préservés ; aucun nouvel audio. Pas de merge/main/Release.",
              "brainmap.md": "PHYSICS-017 : ShipMotion/ZoomGesture → hôte du vrai SOLO ; bridge écran/monde et balayages ; SoloFieldPolicy opt-in pour roches et audio ; mazeRoute + miniboss pour la chasse. Rapport et protocole : docs/solo-physics-017.md. APK/AAB directs : temp/solo-physics-017/.",
              "debughistorical.md": "PHYSICS-017 : revue a corrigé inertie désactivée dans l'arène, UP tactile perdu avec deuxième doigt, double couche translucide/FX au-dessus des murs, couplage zoom/croisière, segment de glissement impropre aux contacts de météores et perte des trajectoires cinétiques historiques. Tests purs et moteur, SDL natif/UBSan et CI exacte verts. Samsung : ressenti, fluidité et visibilité restent à valider.",
              "ordres-de-mission.md": "Ordre complet Fab PHYSICS-017 exécuté et diagnostic exporté après validation technique exacte. src/main.cpp, assets et audio conservés ; modes historiques protégés ; METEOR-009 reste OFF. Aucun merge main ni Release. Intégration définitive seulement après essai Samsung et accord explicite de Fab. Nouveaux bruitages reportés.",
              "todo.md": "- [x] PHYSICS-017 : implémentation du vrai SOLO, revue et correctifs.\n- [x] Tests C++/SDL2/UBSan/Android et non-régressions du commit exact.\n- [x] APK diagnostic + AAB non signé dans temp/solo-physics-017, manifeste/SHA256 vérifiés.\n- [ ] Samsung : inertie Danger1..9, murs, dérive/caméra, gisements, meutes, sons, zoom et transition/final.\n- [ ] Accord explicite Fab avant toute intégration définitive/main/Release.\n- [ ] Nouveaux bruitages : attente des fichiers de Fab, intégration entièrement reportée.",
          }
          for filename, note in additions.items():
              p = Path(filename)
              text = p.read_text()
              if marker not in text:
                  text = text.rstrip() + "\n\n" + marker + "\n" + note + "\n\n" + evidence + "\n"
              p.write_text(text)

          print(evidence)
          PY

          (cd temp/solo-physics-017 && sha256sum --check SHA256SUMS)

      - name: Commit PHYSICS-017 diagnostic and living memories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- temp/solo-physics-017/ docs/solo-physics-017.md docs/superpowers/plans/2026-10-16-solo-physics-017.md brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          if git diff --cached --quiet; then
            echo "PHYSICS-017 diagnostic already exported."
            exit 0
          fi
          git commit -m "chore(solo): deliver verified PHYSICS-017 APK and AAB [skip ci]"
          git fetch origin feature/solo-coop-core-v1
          git rebase origin/feature/solo-coop-core-v1
          git push origin HEAD:refs/heads/feature/solo-coop-core-v1
