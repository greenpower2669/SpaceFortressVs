name: Export verified SOLO BONUS-013 to temp

on:
  push:
    branches: [feature/solo-coop-core-v1]
    paths: [.github/workflows/solo-coop-export-to-temp.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coop-solo-temp-export
  cancel-in-progress: false

jobs:
  unpack-verified-files:
    if: github.repository == 'greenpower2669/SpaceFortressVs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SOLO branch
        uses: actions/checkout@v4
        with:
          ref: feature/solo-coop-core-v1
          persist-credentials: true

      - name: Require exact GREEN BONUS-013 CI and unpack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=38361581767
          source_sha=488de2195e2aa2a1e40f2eec96abaeba19863fad
          short_sha=488de21
          source_dir="$RUNNER_TEMP/solo-bonus-013"
          mkdir -p "$source_dir"

          gh run watch "$source_run" --repo "$GITHUB_REPOSITORY" --exit-status
          conclusion="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          actual_sha="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [[ "$conclusion" == success && "$actual_sha" == "$source_sha" ]] || {
            echo "::error::BONUS-013 source CI is not the required GREEN commit"
            exit 1
          }

          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" \
            --name SpaceFortressVs-1.4.2-release-files --dir "$source_dir"
          (cd "$source_dir" && sha256sum --check SHA256SUMS)

          python3 - "$source_dir" "$source_sha" "$short_sha" "$source_run" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          source_sha = sys.argv[2]
          short_sha = sys.argv[3]
          source_run = int(sys.argv[4])
          destination = Path("temp/solo-bonus-013")
          destination.mkdir(parents=True, exist_ok=True)
          prefix = f"SpaceFortressVs-1.4.2-SOLO-BONUS-013-{short_sha}"

          source_manifest = json.loads((source / "SpaceFortressVs-1.4.2-build.json").read_text())
          assert source_manifest["commit"] == source_sha
          assert source_manifest["packageName"] == "com.greenpower2669.spacefortressvs.diagnostic"

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          delivered = {}
          pairs = [
              ("SpaceFortressVs-1.4.2.apk", prefix + ".apk"),
              ("SpaceFortressVs-1.4.2-unsigned.aab", prefix + "-unsigned.aab"),
          ]
          for original_name, target_name in pairs:
              original = source / original_name
              assert original.is_file() and original.stat().st_size > 0
              sha = digest(original)
              assert sha == source_manifest["files"][original_name]["sha256"]
              target = destination / target_name
              if target.exists():
                  assert digest(target) == sha, "Refuse to replace a different diagnostic"
              else:
                  shutil.copy2(original, target)
              delivered[target_name] = {"sha256": sha, "size": target.stat().st_size}

          manifest = {
              "mission": "SOLO BONUS-013",
              "branch": "feature/solo-coop-core-v1",
              "commit": source_sha,
              "sourceRun": source_run,
              "packageName": source_manifest["packageName"],
              "files": delivered,
              "aabNote": "NON SIGNE; diagnostic phone is the APK debug; no public Release.",
          }
          manifest_path = destination / (prefix + "-build.json")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          sums = [f"{meta['sha256']}  {name}" for name, meta in delivered.items()]
          sums.append(f"{digest(manifest_path)}  {manifest_path.name}")
          (destination / "SHA256SUMS").write_text("\n".join(sums) + "\n")

          evidence_lines = [
              f"Source `{source_sha}`; CI Android/C++/SDL2 `{source_run}` SUCCESS; publish-release SKIPPED.",
              *[f"- `{name}`: {meta['size']} octets, SHA256 `{meta['sha256']}`." for name, meta in delivered.items()],
          ]
          evidence = "\n".join(evidence_lines)

          readme = f"""# SpaceFortress — SOLO BONUS-013 (DIAGNOSTIC)

          Branche : `feature/solo-coop-core-v1`. Aucun merge main ni Release publique.

          {evidence}

          ## À vérifier sur Samsung
          - `TEST BONUS OFF` masque les neuf commandes et ne pause/reset rien.
          - `TEST BONUS ON` affiche PV, ENERGIE, FURTIF, MISSILES, PRISON, GLACE, LAVE, METEORE et TOUS X8.
          - Chaque commande exige BOSS TEST et éjecte visuellement le bonus depuis le boss avant qu'il devienne collectable.
          - En WORLD, l'atterrissage est accessible et le trajet boss→pickup est filtré contre ROCK.
          - Les jauges PV/ENERGIE du joueur restent au-dessus de la navigation Android; HUD boss inchangé.
          - Les explosions d'astéroïdes alternent légèrement entre deux prises historiques avec faible variation de volume; autres FX inchangés.
          - Tourelles SOLO interdites; METEOR-009 reste désactivé.
          """
          (destination / "README.md").write_text("\n".join(line.lstrip() for line in readme.splitlines()) + "\n")

          marker = "## BONUS-013 — livraison vérifiée 13/10/2026"
          additions = {
              "brain.md": "BONUS-013 compilé et packagé depuis le HEAD exact. TEST BONUS, éjection boss, safe-area joueur Samsung et variation audio astéroïdes sont inclus; validation physique Samsung reste nécessaire.",
              "brainmap.md": "Livraison diagnostic: `temp/solo-bonus-013/`. Source et CI exactes ci-dessous; aucun merge main ni Release.",
              "debughistorical.md": "Les deux RED intermédiaires provenaient de tests trop stricts (premier pickup supposé PV; hash audio ne couvrant pas les deux variantes sur 32 séquences), corrigés sans modifier le contrat gameplay. La CI finale exacte est verte.",
              "todo.md": "- [x] CI finale BONUS-013 exacte, APK/AAB et SHA256 vérifiés/exportés.\n- [ ] Samsung: confirmer panneau OFF/ON, huit bonus + TOUS X8, éjection depuis boss, HUD au-dessus navigation et variété FX.",
              "ordres-de-mission.md": "Statut technique BONUS-013: livré en diagnostic à tester sur Samsung. `src/main.cpp` protégé; METEOR-009/tourelles SOLO restent OFF; aucun merge main ni Release.",
          }
          for filename, note in additions.items():
              p = Path(filename)
              text = p.read_text()
              if filename == "todo.md":
                  text = text.replace(
                      "- [ ] Confirmer le workflow Android du HEAD final BONUS-013 et relever run/artifact/SHA avant APK téléphone.",
                      "- [x] Confirmer le workflow Android du HEAD final BONUS-013 et relever run/artifact/SHA avant APK téléphone."
                  )
              if marker not in text:
                  text = text.rstrip() + "\n\n" + marker + "\n" + note + "\n\n" + evidence + "\n"
              p.write_text(text)

          print(evidence)
          PY

          (cd temp/solo-bonus-013 && sha256sum --check SHA256SUMS)

      - name: Commit BONUS-013 diagnostic and living memories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- temp/solo-bonus-013/ brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          if git diff --cached --quiet; then
            echo "BONUS-013 diagnostic already exported."
            exit 0
          fi
          git commit -m "chore(solo): deliver verified BONUS-013 APK and AAB [skip ci]"
          git fetch origin feature/solo-coop-core-v1
          git rebase origin/feature/solo-coop-core-v1
          git push origin HEAD:refs/heads/feature/solo-coop-core-v1
