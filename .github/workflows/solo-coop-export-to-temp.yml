name: Unpack verified SOLO COOP artifact into temp

# Never replace Fab's previous validated APK. New files live in a separate
# temp/ directory and may only be unpacked from the exact GREEN Android CI.
on:
  push:
    branches:
      - feature/solo-coop-core-v1
    paths:
      - .github/workflows/solo-coop-export-to-temp.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coop-solo-temp-export
  cancel-in-progress: false

jobs:
  unpack-verified-files:
    if: github.repository == 'greenpower2669/SpaceFortressVs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout only the SOLO branch
        uses: actions/checkout@v4
        with:
          ref: feature/solo-coop-core-v1
          persist-credentials: true

      - name: Require GREEN tests and download exact diagnostic source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=38190409848
          source_sha=d016f6196481fe73bc6e4947aebfd30aeb052da4
          artifact_dir="$RUNNER_TEMP/coop-solo-meteor-009"
          destination="temp/solo-world-meteor-009"
          mkdir -p "$artifact_dir" "$destination"

          # IMPORTANT: this workflow starts independently of Android CI. Do
          # not unpack old binaries, even if the new Android build is pending.
          gh run watch "$source_run" --repo "$GITHUB_REPOSITORY" --exit-status
          actual_conclusion="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          actual_sha="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [[ "$actual_conclusion" == success && "$actual_sha" == "$source_sha" ]] || {
            echo "::error::Source CI is not green at required commit"
            exit 1
          }
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" \
            --name SpaceFortressVs-1.4.2-release-files --dir "$artifact_dir"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          python3 - "$artifact_dir" "$source_sha" <<'PY'
          import json
          from pathlib import Path
          import sys
          d, expected = Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads((d / 'SpaceFortressVs-1.4.2-build.json').read_text())
          assert manifest['commit'] == expected
          assert manifest['packageName'] == 'com.greenpower2669.spacefortressvs.diagnostic'
          for filename in ('SpaceFortressVs-1.4.2.apk',
                           'SpaceFortressVs-1.4.2-unsigned.aab',
                           'SpaceFortressVs-1.4.2-build.json',
                           'SHA256SUMS', 'release-notes.md'):
              p = d / filename
              assert p.is_file() and p.stat().st_size < 100_000_000, filename
              print(f'VERIFIED {filename} ({p.stat().st_size} bytes)')
          PY
          cp "$artifact_dir/SpaceFortressVs-1.4.2.apk" "$destination/"
          cp "$artifact_dir/SpaceFortressVs-1.4.2-unsigned.aab" "$destination/"
          cp "$artifact_dir/SpaceFortressVs-1.4.2-build.json" "$destination/"
          cp "$artifact_dir/SHA256SUMS" "$destination/"
          cp "$artifact_dir/release-notes.md" "$destination/"
          (cd "$destination" && sha256sum --check SHA256SUMS)
          cat > "$destination/README.md" <<'TXT'
          # SpaceFortress — SOLO WORLD METEOR-009 (DIAGNOSTIC)
          
          Nouveau build extrait UNIQUEMENT après CI complète verte :
          https://github.com/greenpower2669/SpaceFortressVs/actions/runs/38190409848
          
          Source compilée et testée : d016f6196481fe73bc6e4947aebfd30aeb052da4
          Branche : feature/solo-coop-core-v1
          APK Android diagnostic : SpaceFortressVs-1.4.2.apk
          AAB NON SIGNÉ : SpaceFortressVs-1.4.2-unsigned.aab
          Empreintes : SHA256SUMS (contrôlées après extraction)
          Identité Android : com.greenpower2669.spacefortressvs.diagnostic
          
          MONDE TEST : ni bonus collectible ni tourelles. Toutes les 18..32 s,
          une vague remplace le bonus avec de VRAIS astéroïdes minables.
          La poussière historique permet la recharge; le boss TEST du monde
          subit les chocs sur son champ cinétique réel (55% de dissipation).
          Bouton supérieur droit : BOSS TEST/BOSS OFF dans MONDE TEST;
          bouton central MONDE ON pour quitter le labyrinthe vers ARENE.
          Vrai pilote bleu COOP, caméra, sons charge 0,20/2 secondes conservés.
          Le CLASSIQUE, DUEL et COOP historique ne changent pas.
          Boss WORLD fixe et expérimental : AI/rencontres à intégrer plus tard.
          
          Les anciens fichiers temp/SpaceFortressVs-1.4.2.apk et
          temp/SpaceFortressVs-1.4.2-unsigned.aab et
          temp/solo-world-cleanup-008/ sont CONSERVÉS.
          Aucune fusion main ni Release publique. Validation Samsung requise.
          TXT

      - name: Commit unpacked new APK without replacing previous file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- temp/solo-world-meteor-009/
          if git diff --cached --quiet; then
            echo "No new artifact content to publish."
            exit 0
          fi
          git commit -m "chore(solo): unpack verified meteor-009 APK alongside old diagnostics [skip ci]"
          git push origin HEAD:refs/heads/feature/solo-coop-core-v1
