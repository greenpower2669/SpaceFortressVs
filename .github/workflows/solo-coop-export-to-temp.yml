name: Export verified SOLO PARALLAX-016 to temp

on:
  push:
    branches: [feature/solo-coop-core-v1]
    paths: [.github/workflows/solo-coop-export-to-temp.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: coop-solo-temp-export
  cancel-in-progress: false

jobs:
  unpack-verified-files:
    if: github.repository == 'greenpower2669/SpaceFortressVs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SOLO branch
        uses: actions/checkout@v4
        with:
          ref: feature/solo-coop-core-v1
          persist-credentials: true

      - name: Require exact GREEN PARALLAX-016 CI and unpack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=38837760766
          source_sha=2a933a60639d890fd6168befb8ce1784ba9a18c8
          short_sha=2a933a6
          source_dir="$RUNNER_TEMP/solo-parallax-016"
          mkdir -p "$source_dir"

          gh run watch "$source_run" --repo "$GITHUB_REPOSITORY" --exit-status
          conclusion="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          actual_sha="$(gh run view "$source_run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          [[ "$conclusion" == success && "$actual_sha" == "$source_sha" ]] || {
            echo "::error::PARALLAX-016 source CI is not the required GREEN commit"
            exit 1
          }

          gh run download "$source_run" --repo "$GITHUB_REPOSITORY"             --name SpaceFortressVs-1.4.2-release-files --dir "$source_dir"
          (cd "$source_dir" && sha256sum --check SHA256SUMS)

          python3 - "$source_dir" "$source_sha" "$short_sha" "$source_run" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          source_sha = sys.argv[2]
          short_sha = sys.argv[3]
          source_run = int(sys.argv[4])
          destination = Path("temp/solo-parallax-016")
          destination.mkdir(parents=True, exist_ok=True)
          prefix = f"SpaceFortressVs-1.4.2-SOLO-PARALLAX-016-{short_sha}"

          source_manifest = json.loads((source / "SpaceFortressVs-1.4.2-build.json").read_text())
          assert source_manifest["commit"] == source_sha
          assert source_manifest["packageName"] == "com.greenpower2669.spacefortressvs.diagnostic"

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          delivered = {}
          pairs = [
              ("SpaceFortressVs-1.4.2.apk", prefix + ".apk"),
              ("SpaceFortressVs-1.4.2-unsigned.aab", prefix + "-unsigned.aab"),
          ]
          for original_name, target_name in pairs:
              original = source / original_name
              assert original.is_file() and original.stat().st_size > 0
              sha = digest(original)
              assert sha == source_manifest["files"][original_name]["sha256"]
              target = destination / target_name
              if target.exists():
                  assert digest(target) == sha, "Refuse to replace a different diagnostic"
              else:
                  shutil.copy2(original, target)
              delivered[target_name] = {"sha256": sha, "size": target.stat().st_size}

          atlas = Path("assets/pict/solo/SoloBonusAnimations.png")
          assert atlas.is_file()
          atlas_sha = digest(atlas)
          assert atlas_sha == "1a337adb15a6a3901b76da566dcd26a1d2d76c26893864a37a85e97b63950001"

          parallax = Path("assets/pict/solo/FondsParallaxeModeSolo.png")
          parallax_sha = digest(parallax)
          assert parallax_sha == "4becaec70bf7f23d823c3eccbd902b86aa4dbb6942115a1389409bc6a7f7df44"

          manifest = {
              "mission": "SOLO PARALLAX-016",
              "branch": "feature/solo-coop-core-v1",
              "commit": source_sha,
              "sourceRun": source_run,
              "packageName": source_manifest["packageName"],
              "animationAtlas": {
                  "path": str(atlas),
                  "layout": "4x8 frames, 192x192",
                  "sha256": atlas_sha,
              },
              "parallaxAtlas": {"path": str(parallax), "sha256": parallax_sha,
                                "width": 1254, "height": 1254, "alpha": True},
              "files": delivered,
              "aabNote": "NON SIGNE; diagnostic phone is the APK debug; no public Release.",
          }
          manifest_path = destination / (prefix + "-build.json")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          sums = [f"{meta['sha256']}  {name}" for name, meta in delivered.items()]
          sums.append(f"{digest(manifest_path)}  {manifest_path.name}")
          (destination / "SHA256SUMS").write_text("\n".join(sums) + "\n")

          evidence_lines = [
              f"Source `{source_sha}`; CI Android/C++/SDL2 `{source_run}` SUCCESS; publish-release SKIPPED.",
              f"- Atlas animé: `assets/pict/solo/SoloBonusAnimations.png`, 1536x768, 4x8 frames de 192 px, SHA256 `{atlas_sha}`.",
              f"- Fond ajouré : `{parallax}`, RGBA1254x1254, SHA256 `{parallax_sha}`.",
              *[f"- `{name}`: {meta['size']} octets, SHA256 `{meta['sha256']}`." for name, meta in delivered.items()],
          ]
          evidence = "\n".join(evidence_lines)

          readme = f"""# SpaceFortress — SOLO PARALLAX-016 (DIAGNOSTIC)

          Branche : `feature/solo-coop-core-v1`. Aucun merge main ni Release publique.

          {evidence}

          ## Lancer le vrai SOLO

          Dans l'accueil diagnostic, choisir **JOUER : SOLO / COOP / DUEL**.
          Dans le vrai sélecteur historique, toucher le choix de mode jusqu'à **SOLO**, puis **JOUER**.
          ANCIEN PROTOTYPE SOLO et SOLO BONUS 012 restent des entrées de diagnostic distinctes.

          ## Contenu

          - NOUVEAU : ciel historique lointain, fond minéral avec neuf ouvertures alpha réelles.
          - Parallaxe indépendante : ciel 0,08, minéral 0,34, parois/acteurs 1,0 ; aucun changement de pilotage.
          - ParoisModeSolo et EnvironnementsModeSolo raccordés au vrai SOLO ; murs pleins, géométrie inchangée.
          - Raccords testés à plusieurs échelles, dont la capture réduite de l'antre ; rechargement textures après reset.
          - Labyrinthe existant avec quatre miniboss espacés sur le chemin accessible vers l'antre.
          - Miniboss : 180 PV, poursuite courte, avertissement puis salve x3 ; aucun bonus, même à la mort.
          - Pilotage tactile, caméra circulaire, énergie, minage et cinétique historiques conservés.
          - Antre identifié : transition de 1 s de temps actif, zoom/ondulation, puis arène finale.
          - Même moteur et initialiseur de boss que BOSS TEST ; aucun bouton diagnostic en vrai SOLO.
          - Boss final seul : bonus à 75/50/25 % et à la mort, éjections et animations BONUS-014 conservées.
          - PV, énergie et pouvoirs conservés lors du passage ; transition sans consommation de leur durée.
          - Après victoire, laisser les récompenses arriver, les ramasser puis toucher TERMINER.
          - Sauvegarde SOLO compatible : le prochain lancement ouvre le premier niveau non terminé.
            La position au milieu d'un niveau n'est pas sauvegardée.
          - Aucune tourelle SOLO ; METEOR-009 reste désactivé. Pas de correction annoncée des anciennes
            collisions d'astéroïdes avec les parois.
          - `src/main.cpp` inchangé ; mécanismes CLASSIQUE/DUEL/COOP protégés.

          ## À vérifier physiquement sur Samsung

          1. Vrai sélecteur SOLO : vérifier textures des murs, trous vers le ciel et retour exact du décor en revenant sur ses pas.
          2. Vaisseau sous le doigt, caméra continue, minage et commandes de tir humain.
          3. Quatre rencontres : placement, lisibilité, dégâts et zéro bonus après les minibosses.
          4. Antre : zoom/ondulation lisible, sans tir involontaire ni bouton de test dans l'arène.
          5. Mise en arrière-plan/reprise pendant la transition, sans perte de PV/énergie/pouvoirs.
          6. Boss final, quatre seuils de récompenses, collecte puis TERMINER et niveau suivant.
          7. Aspect des répétitions de parois, fluidité réelle et jauges au-dessus de la barre Android ; aucun FPS téléphone n'est encore certifié.
          """
          (destination / "README.md").write_text("\n".join(line.lstrip() for line in readme.splitlines()) + "\n")

          marker = "## PARALLAX-016 — livraison vérifiée 16/10/2026"
          additions = {
              "brain.md": "PARALLAX-016 livré : trois plans visuels du vrai SOLO, ciel historique et fond minéral ajouré, atlas de parois/environnements réutilisés. Aucun changement de caméra/physique/gameplay. Validation Samsung encore requise.",
              "brainmap.md": "PARALLAX-016 : coop_solo_session_runtime → CoopSoloScenery ; ressources communes solo_scenery_assets/atlas ; textures par renderer, reset/release explicites. Diagnostic APK/AAB : temp/solo-parallax-016/ ; détails docs/solo-parallax-016.md.",
              "debughistorical.md": "PARALLAX-016 : défaut de raccord à échelle fractionnaire trouvé par revue puis corrigé par éventail de triangles sans scissor par cellule. Tests pixel rectangle/32cellules et murs sur fonds opposés verts à quatre échelles. CI complète C++/SDL2/Android du commit exact verte. Validation visuelle et performances Samsung encore à faire.",
              "ordres-de-mission.md": "Ordre graphique Fab PARALLAX-016 exécuté. Atlas existants et géométrie conservés ; vraie transparence et parallaxe indépendante. src/main.cpp inchangé, aucun merge main ni Release, tourelles SOLO et METEOR-009 OFF. APK diagnostic identifiée et AAB non signé exportés après CI verte.",
              "todo.md": "- [x] PARALLAX-016 : nouveau fond, ressources existantes et rendu du vrai SOLO.\n- [x] Revue, correction des jointures et tests SDL à plusieurs échelles.\n- [x] CI C++/SDL2/Android du commit exact et export APK/AAB avec SHA256.\n- [ ] Samsung : aspect, lisibilité, répétitions, fluidité, pause/reprise et antre.\n- [ ] Hors périmètre : astéroïdes stationnaires, nouvelle couronne lente et nouvelles poursuites miniboss.",
          }
          for filename, note in additions.items():
              p = Path(filename)
              text = p.read_text()
              if marker not in text:
                  text = text.rstrip() + "\n\n" + marker + "\n" + note + "\n\n" + evidence + "\n"
              p.write_text(text)

          print(evidence)
          PY

          (cd temp/solo-parallax-016 && sha256sum --check SHA256SUMS)

      - name: Commit PARALLAX-016 diagnostic and living memories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- temp/solo-parallax-016/ brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md
          if git diff --cached --quiet; then
            echo "PARALLAX-016 diagnostic already exported."
            exit 0
          fi
          git commit -m "chore(solo): deliver verified PARALLAX-016 APK and AAB [skip ci]"
          git fetch origin feature/solo-coop-core-v1
          git rebase origin/feature/solo-coop-core-v1
          git push origin HEAD:refs/heads/feature/solo-coop-core-v1
