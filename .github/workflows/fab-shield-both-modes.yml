name: FAB shared shield both modes

on:
  push:
    branches: [fix/gameplay-campaign-200]
    paths:
      - .github/workflows/fab-shield-both-modes.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gameplay-campaign-200
          fetch-depth: 0

      - name: Install native regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Add RED shield contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/restoration_regressions.hpp')
          s=p.read_text()
          marker='static void testCollectedBonusAndShield()\n{'
          assert marker in s
          red=r'''static void testSharedLinearShieldModel()
          {
              // RED contract: 90% shield must let exactly 10% through, not 1%.
              assert(std::abs(sfShieldDamage(100.0f,5.0f)-10.0f)<.001f);
              assert(std::abs(sfShieldDamage(100.0f,25.0f)-50.0f)<.001f);
              std::puts("PASS: linear shield RED contract");
          }

          static void testCollectedBonusAndShield()
          {'''
          s=s.replace(marker,red,1)
          p.write_text(s)

          p=Path('tests/regressions.cpp');s=p.read_text()
          old='testNoHumanAutofire();testPassiveCoopTurrets();testCollectedBonusAndShield();testRealCoopField();'
          new='testNoHumanAutofire();testPassiveCoopTurrets();testSharedLinearShieldModel();testCollectedBonusAndShield();testRealCoopField();'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY

      - name: Prove old model fails the new contract
        shell: bash
        run: |
          set +e
          bash scripts/test-regressions.sh > /tmp/shield-red.log 2>&1
          code=$?
          set -e
          tail -80 /tmp/shield-red.log
          if [ "$code" -eq 0 ]; then
            echo 'ERROR: RED test unexpectedly passed before implementation'
            exit 1
          fi
          echo 'RED confirmed: previous quadratic shield rejects the linear contract.'

      - name: Implement shared shield model, classic routing and final tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {text.count(old)}')
              return text.replace(old,new,1)

          # Shared core: one linear shield implementation for duel and coop.
          p=Path('src/ship_energy.hpp');s=p.read_text()
          old=r'''static float sfShieldDamage(float damage,float heat)
          {
              const float spent=sfShipHeat(heat)/SF_MAX_SHIP_HEAT;
              return damage*spent*spent;
          }
          '''
          new=r'''static float sfShieldSpent(float heat)
          {
              return sfShipHeat(heat)/SF_MAX_SHIP_HEAT;
          }
          static float sfShieldFraction(float heat)
          {
              return 1.0f-sfShieldSpent(heat);
          }
          static float sfShieldDamage(float damage,float heat)
          {
              return std::max(0.0f,damage)*sfShieldSpent(heat);
          }
          static float sfShieldWear(float damage,float heat)
          {
              const float factor=std::clamp(.1f+sfShieldSpent(heat),.1f,1.0f);
              return std::max(0.0f,damage)*factor;
          }
          static float sfApplyShieldImpact(sprite *ship,float incomingDamage)
          {
              if (!ship || incomingDamage<=0) return 0;
              const float heatBefore=sfShipHeat(ship->nrj);
              const float hullDamage=sfShieldDamage(incomingDamage,heatBefore);
              sfAddShipHeat(ship,sfShieldWear(incomingDamage,heatBefore));
              return hullDamage;
          }
          static float sfApplyShieldContinuousImpact(sprite *ship,float incomingPerSecond,float dt)
          {
              if (!ship || incomingPerSecond<=0 || dt<=0) return 0;
              // Fixed internal integration keeps continuous contact independent of render FPS.
              constexpr float step=1.0f/240.0f;
              float remaining=dt,total=0;
              while (remaining>1e-6f) {
                  const float slice=std::min(step,remaining);
                  total+=sfApplyShieldImpact(ship,incomingPerSecond*slice);
                  remaining-=slice;
              }
              return total;
          }
          '''
          s=replace_once(s,old,new,'ship shield core')
          p.write_text(s)

          # White dust: one full historical particle restores 0.25 heat = 0.5% reserve.
          p=Path('src/tactical_runtime.hpp');s=p.read_text()
          old='winner->nrj=sfShipHeat(sfShipHeat(winner->nrj)*.998f-.02f*value);'
          new='winner->nrj=sfShipHeat(sfShipHeat(winner->nrj)-.25f*value);'
          s=replace_once(s,old,new,'white dust recovery')
          p.write_text(s)

          # Cooperative projectiles, boss contact and asteroids use the shared shield resolver.
          p=Path('src/campaign_runtime.hpp');s=p.read_text()
          old=r'''    ship->pv=std::max(0.0f,ship->pv-SF_COOP_INCOMING_DAMAGE_MULTIPLIER*sfShieldDamage(damage,ship->nrj));
              sfAddShipHeat(ship,2); sfCoop.invulnerable[owner]=.38f;'''
          new=r'''    const float incoming=SF_COOP_INCOMING_DAMAGE_MULTIPLIER*damage;
              ship->pv=std::max(0.0f,ship->pv-sfApplyShieldImpact(ship,incoming));
              sfCoop.invulnerable[owner]=.38f;'''
          s=replace_once(s,old,new,'coop projectile shield')
          old=r'''    sfAddShipHeat(ship,45.0f*dt);
              const float spent=sfShipHeat(ship->nrj)/SF_MAX_SHIP_HEAT;
              ship->pv=std::max(0.0f,ship->pv-SF_COOP_INCOMING_DAMAGE_MULTIPLIER*650.0f*spent*spent*dt);'''
          new=r'''    const float incomingPerSecond=SF_COOP_INCOMING_DAMAGE_MULTIPLIER*650.0f;
              ship->pv=std::max(0.0f,ship->pv-sfApplyShieldContinuousImpact(ship,incomingPerSecond,dt));'''
          s=replace_once(s,old,new,'coop continuous contact shield')
          old=r'''    const float area=legacyDamage/.05f;
              ship->pv=std::max(0.0f,ship->pv-SF_COOP_INCOMING_DAMAGE_MULTIPLIER*sfShieldDamage(legacyDamage,ship->nrj));
              sfAddShipHeat(ship,area*.0001f);'''
          new=r'''    const float incoming=SF_COOP_INCOMING_DAMAGE_MULTIPLIER*legacyDamage;
              ship->pv=std::max(0.0f,ship->pv-sfApplyShieldImpact(ship,incoming));'''
          s=replace_once(s,old,new,'coop asteroid shield')
          p.write_text(s)

          # Android classic mode keeps src/main.cpp byte-identical. Route its generated copy
          # through the same shared resolver while preserving historical unshielded powers.
          p=Path('scripts/prepare-legacy-source.cmake');s=p.read_text()
          anchor='''sf_replace_region("bounded missile impact heat" "float missnrjminus(sprite *e){" "float misspvminus(" "float missnrjminus(sprite *e){ return sfShotHeat(e); }\\n\\n")\n'''
          addition=anchor+'''sf_replace_region("linear shield missile raw damage" "float misspvminus(sprite *e){" "float pvminus(" "float misspvminus(sprite *e){ (void)e; return rand()%10+1875.0f; }\\n")\n          sf_replace_region("linear shield normal raw damage" "float pvminus(sprite *e){" "float nrjminus(" "float pvminus(sprite *e){ (void)e; return rand()%10+75.0f; }\\n")\n'''
          s=replace_once(s,anchor,addition,'classic raw damage patches')
          anchor='''endforeach()\n          sf_replace_region("bounded energy HUD"'''
          routing='''endforeach()\n          # D-140-12: classic Android generated copy now uses the same linear shield core.\n          foreach(sf_ship Spritej1 Spritej2)\n              sf_patch_once("${sf_ship} missile linear shield hull" "${sf_ship}->pv-=misspvminus(${sf_ship});" "${sf_ship}->pv-=sfApplyShieldImpact(${sf_ship},misspvminus(${sf_ship}));")\n              sf_patch_once("${sf_ship} normal linear shield hull" "${sf_ship}->pv-=pvminus(${sf_ship});" "${sf_ship}->pv-=sfApplyShieldImpact(${sf_ship},pvminus(${sf_ship}));")\n              sf_patch_once("${sf_ship} missile shared wear only" "sfAddShipHeat(${sf_ship},missnrjminus(e));" "/* shared shield resolver owns missile wear */")\n              sf_patch_once("${sf_ship} normal shared wear only" "sfAddShipHeat(${sf_ship},nrjminus(e));" "/* shared shield resolver owns shot wear */")\n              sf_patch_once("${sf_ship} asteroid linear shield hull" "${sf_ship}->pv-=${sf_ship}->nrj*${sf_ship}->nrj*e->w*e->h*0.00002;" "${sf_ship}->pv-=sfApplyShieldImpact(${sf_ship},e->w*e->h*.05f);")\n              sf_patch_once("${sf_ship} asteroid shared wear only" "sfAddShipHeat(${sf_ship},e->w*e->h*0.0001);" "/* shared shield resolver owns asteroid wear */")\n          endforeach()\n          sf_replace_region("bounded energy HUD"'''
          s=replace_once(s,anchor,routing,'classic shield routing')
          p.write_text(s)

          # Replace the initial RED-only test with the full shared contract.
          p=Path('tests/restoration_regressions.hpp');s=p.read_text()
          old=r'''static void testSharedLinearShieldModel()
          {
              // RED contract: 90% shield must let exactly 10% through, not 1%.
              assert(std::abs(sfShieldDamage(100.0f,5.0f)-10.0f)<.001f);
              assert(std::abs(sfShieldDamage(100.0f,25.0f)-50.0f)<.001f);
              std::puts("PASS: linear shield RED contract");
          }
          '''
          new=r'''static void testSharedLinearShieldModel()
          {
              struct Case { float heat,spent,wear; };
              const Case cases[]={{0,0,.1f},{5,.1f,.2f},{10,.2f,.3f},{25,.5f,.6f},{45,.9f,1.0f},{50,1.0f,1.0f}};
              for(const auto &c:cases) {
                  assert(std::abs(sfShieldFraction(c.heat)-(1.0f-c.spent))<.0001f);
                  assert(std::abs(sfShieldDamage(10.0f,c.heat)-10.0f*c.spent)<.001f);
                  assert(std::abs(sfShieldWear(10.0f,c.heat)-10.0f*c.wear)<.001f);
                  sprite ship;ship.nrj=c.heat;
                  const float hull=sfApplyShieldImpact(&ship,10.0f);
                  assert(std::abs(hull-10.0f*c.spent)<.001f);
                  assert(std::abs(ship.nrj-std::min(50.0f,c.heat+10.0f*c.wear))<.001f);
              }
              setupTactics();Spritej1->nrj=30;Spritej1->pv=900;
              for(int i=0;i<29;++i) {auto *dust=new parts(Spritej1->x,Spritej1->y);dust->pv=600;particules.push_back(dust);}
              sfCollectDust();
              assert(std::abs(Spritej1->nrj-22.75f)<.02f && Spritej1->pv>908.0f && Spritej1->pv<=909.0f);
              std::puts("PASS: one linear shield core and historical white-dust recharge serve duel and coop");
          }
          '''
          s=replace_once(s,old,new,'final shared shield test')

          old=r'''    Spritej1->nrj=0;Spritej2->nrj=50;
              sfCoopHurt(0,100);sfCoopHurt(1,100);
              assert(Spritej1->pv==1000 && Spritej2->pv==0);
              assert(Spritej1->nrj>0 && Spritej2->nrj==50);'''
          new=r'''    Spritej1->nrj=0;Spritej2->nrj=50;
              sfCoopHurt(0,10);sfCoopHurt(1,10);
              assert(Spritej1->pv==1000 && Spritej2->pv==850);
              assert(std::abs(Spritej1->nrj-15.0f)<.01f && Spritej2->nrj==50);'''
          s=replace_once(s,old,new,'coop full/empty shield expectation')

          old=r'''    for(int fps:{30,60,120}) {
                  setupCampaign();auto *ship=Spritej1;ship->pv=5000;ship->nrj=0;
                  const float dt=1.0f/fps;
                  float legacyHeat=0,legacyLoss=0;
                  for(int frame=0;frame<fps/2;++frame) {
                      legacyHeat=sfShipHeat(legacyHeat+45.0f*dt);
                      const float spent=sfShipHeat(legacyHeat)/SF_MAX_SHIP_HEAT;
                      legacyLoss+=650.0f*spent*spent*dt;
                      sfCoopBossContact(0,dt);
                  }
                  const float actualLoss=5000.0f-ship->pv;
                  assert(ship->pv>0 && std::abs(actualLoss-SF_COOP_INCOMING_DAMAGE_MULTIPLIER*legacyLoss)<.02f);
              }'''
          new=r'''    std::array<float,3> contactLoss{};int contactIndex=0;
              for(int fps:{30,60,120}) {
                  setupCampaign();auto *ship=Spritej1;ship->pv=5000;ship->nrj=0;
                  const float dt=1.0f/fps;
                  for(int frame=0;frame<fps/2;++frame) sfCoopBossContact(0,dt);
                  contactLoss[contactIndex++]=5000.0f-ship->pv;
                  assert(ship->pv>0 && ship->nrj==50);
              }
              assert(std::abs(contactLoss[0]-contactLoss[1])<.1f && std::abs(contactLoss[1]-contactLoss[2])<.1f);'''
          s=replace_once(s,old,new,'fps independent boss contact')
          s=replace_once(s,'assert(Spritej1->nrj>25 && Spritej1->pv<=909);','assert(std::abs(Spritej1->nrj-22.75f)<.02f && Spritej1->pv<=909);','29 dust expectation')
          p.write_text(s)

          # Living project memories and mission contract.
          stamp='2026-10-03'
          append={
          'brain.md':f'''\n\n## D-140-12 — bouclier linéaire partagé duel + coop — {stamp}\nFab demande un seul comportement de bouclier pour les deux modes : nrj=0 = 100% protection, nrj=50 = 0%. La part PV est linéaire (spent=nrj/50). L'usure après impact vaut la puissance brute du coup × clamp(0.1+spent, 0.1, 1.0), calculée sur l'état pré-impact. Le coop conserve ×15 une seule fois avant résolution du bouclier. Le contact boss utilise une intégration interne fixe 240 Hz pour rester stable à 30/60/120 FPS. Une poussière blanche pleine restaure 0.25 nrj (0.5% de la réserve), donc ~14.5% pour 29 poussières. Le mode classique Android est routé vers le même cœur dans la copie générée ; src/main.cpp reste byte-identique.\n''',
          'brainmap.md':'''\n\n## D-140-12 — chaîne bouclier commune\nDUEL généré Android + COOP → sfApplyShieldImpact → protection linéaire → PV → usure liée au coup.\nContact coop → sfApplyShieldContinuousImpact(240 Hz interne).\nPoussière blanche → sfCollectDust → -0.25 nrj pleine. Rouge coop → petite hausse nrj uniquement.\nsrc/main.cpp historique inchangé.\n''',
          'debughistorical.md':'''\n\n## D-140-12 — remplacement du bouclier quadratique\nCause du ressenti incohérent : sfShieldDamage utilisait spent² et le coop ajoutait une usure fixe (+2), tandis que le duel généré conservait des formules nrj² et des ajouts de chaleur séparés. Correctif : cœur partagé linéaire dans ship_energy.hpp ; duel Android routé via prepare-legacy-source.cmake sans modifier main.cpp ; coop projectiles/contact/astéroïdes routés vers le même résolveur. Poussière blanche portée à 0.25 nrj par particule pleine. Tests RED puis GREEN obligatoires et CI Android fraîche requise.\n''',
          'todo.md':'''\n\n## D-140-12 — bouclier linéaire deux modes\n- [x] Unifier le cœur de protection/usure duel + coop sans modifier src/main.cpp.\n- [x] Protection linéaire 100/90/80/.../0 %.\n- [x] Usure 10/20/30/.../100 % de la puissance reçue selon réserve pré-impact.\n- [x] Poussière blanche pleine = 0.25 nrj récupéré (~0.5 % bouclier).\n- [x] Contact boss intégré à pas fixe interne pour 30/60/120 FPS.\n- [ ] CI Android fraîche + APK/AAB.\n- [ ] Validation téléphone Fab dans les deux modes.\n''',
          'ordres-de-mission.md':'''\n\n## Mission D-140-12 — bouclier commun duel + coop\nFab demande le même modèle de bouclier dans les deux modes. Protection = pourcentage de réserve restant ; usure = 10% du coup à 100% de bouclier, 20% à 90%, etc., jusqu'à 100%. Coop garde ×15 exactement une fois. Les poussières blanches restaurent ~0.5% de bouclier chacune. Le duel Android doit passer par la copie générée et src/main.cpp reste historique. Aucun merge main, aucune release ; validation téléphone par Fab.\n'''
          }
          for name,text in append.items():
              q=Path(name);q.write_text(q.read_text()+text)
          PY

      - name: Run GREEN native regressions
        run: bash scripts/test-regressions.sh

      - name: Verify historical main remains byte-identical and classic route exists
        shell: bash
        run: |
          git diff --exit-code -- src/main.cpp
          grep -q 'linear shield missile raw damage' scripts/prepare-legacy-source.cmake
          grep -q 'sfApplyShieldImpact' scripts/prepare-legacy-source.cmake
          grep -q 'sfApplyShieldContinuousImpact' src/campaign_runtime.hpp
          grep -q -- '-.25f\*value' src/tactical_runtime.hpp

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fab-shield-both-modes.yml
          git config user.name 'FAB Copilot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/ship_energy.hpp src/tactical_runtime.hpp src/campaign_runtime.hpp scripts/prepare-legacy-source.cmake tests/restoration_regressions.hpp tests/regressions.cpp brain.md brainmap.md debughistorical.md todo.md ordres-de-mission.md .github/workflows/fab-shield-both-modes.yml
          git commit -m 'balance: share linear shield across duel and coop'
          git push origin HEAD:fix/gameplay-campaign-200
          git rev-parse HEAD
