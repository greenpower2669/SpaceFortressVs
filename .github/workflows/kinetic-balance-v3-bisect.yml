name: Kinetic balance v3 regression bisect
on:
  push:
    branches: [fix/gameplay-campaign-200]
    paths:
      - .github/workflows/kinetic-balance-v3-bisect.yml
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Restore canonical regression input
        run: |
          git fetch origin 1459be010968e59d2860070f4a390ca3c327940f --depth=1
          git show 1459be010968e59d2860070f4a390ca3c327940f:tests/regressions.cpp > tests/regressions.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/regressions.cpp')
          t=p.read_text()
          assert t.count('finger(SDL_FINGERDOWN, 11, .5f, .60f)')==1
          assert t.count('finger(SDL_FINGERDOWN, 13, .5f, .60f)')==1
          t=t.replace('finger(SDL_FINGERDOWN, 11, .5f, .60f)','finger(SDL_FINGERDOWN, 11, .5f, .66f)')
          t=t.replace('finger(SDL_FINGERDOWN, 13, .5f, .60f)','finger(SDL_FINGERDOWN, 13, .5f, .66f)')
          p.write_text(t)
          PY
      - name: Install SDL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
      - name: Apply approved v3 changes and adapted legacy assertions
        run: |
          python3 scripts/apply-kinetic-balance-v3b.py
          python3 scripts/adapt-kinetic-balance-v3-tests.py
      - name: Replace main with robust diagnostic checkpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/regressions.cpp')
          t=p.read_text()
          cut=t.index('int main(int argc,char **argv)')
          main=r'''int main(int argc,char **argv)
{
    (void)argc; (void)argv;
    assert(SDL_Init(SDL_INIT_TIMER) == 0);
    auto stop=[](const char *tag){const char *s=std::getenv("SF_DIAG_STOP");return s && std::string(s)==tag;};
    testVectors(); testLegacyCrashes(); testInput(); testTextures(); testScenicRendering();
    if(stop("A")) return 0;
    testTacticalPilot(); testTacticalTurrets(); testJupiterMotion(); testRaidsAndDefence();
    if(stop("B")) return 0;
    testEnergyFeedback(); testProjectileFeedback();
    if(stop("C")) return 0;
    char campaignDirectory[]="/tmp/spacefortress-campaign-XXXXXX";
    assert(mkdtemp(campaignDirectory));
    testVelocityGhosts();testCampaignPersistence(campaignDirectory);testCoopGameplay();testCoopArenaBounds();testCoopCollisionMinerals();testCampaignEntryAndFights();testCampaignProgression();
    testCampaignRendering(std::getenv("SPACEFORTRESS_CAMPAIGN_PREVIEW"));
    if(stop("D")) return 0;
    testDuelStyleRoundTrip();testShipBreathing();testCoopHumanAim();testUnknownSaveWithBackup(campaignDirectory);testSaveRecoveryPreservation(campaignDirectory);
    if(stop("E")) return 0;
    testNoHumanAutofire();testPassiveCoopTurrets();testSharedLinearShieldModel();testKineticFieldAndHullRegen();testCollectedBonusAndShield();testRealCoopField();
    if(stop("F")) return 0;
    testCoopDifficultyChain();testCoopIncomingDamageMultiplier();testCoopHudAndMissile();
    if(stop("G")) return 0;
    testDurableV1Migration(campaignDirectory);testDifficultySelection();testDifficultyGameplay();testDifficultyRendering(std::getenv("SPACEFORTRESS_DIFFICULTY_PREVIEW"));
    if(stop("H")) return 0;
    return 0;
}
'''
          p.write_text(t[:cut]+main)
          PY
      - name: Prepare test assets
        run: |
          rm -rf "$RUNNER_TEMP/sf-reg"
          mkdir -p "$RUNNER_TEMP/sf-reg/resources/assets"
          python3 scripts/prepare-assets.py --output "$RUNNER_TEMP/sf-reg/resources/assets"
      - name: Compile checkpointed full SDL regression binary
        run: |
          read -r -a CFLAGS <<< "$(pkg-config --cflags sdl2 SDL2_image SDL2_mixer)"
          read -r -a LIBS <<< "$(pkg-config --libs sdl2 SDL2_image SDL2_mixer)"
          g++ -std=c++17 -O1 -g -D_GLIBCXX_DEBUG -fsanitize=undefined -fno-sanitize-recover=all -ffunction-sections -fdata-sections -I src -I tests/include "${CFLAGS[@]}" tests/regressions.cpp -Wl,--gc-sections "${LIBS[@]}" -pthread -o "$RUNNER_TEMP/sf-reg/regressions"
      - name: A - base input textures scenic
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: A }
        run: ./regressions
      - name: B - tactical and raids
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: B }
        run: ./regressions
      - name: C - feedback
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: C }
        run: ./regressions
      - name: D - campaign core
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: D }
        run: ./regressions
      - name: E - maintenance saves ships
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: E }
        run: ./regressions
      - name: F - restoration kinetic and field
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: F }
        run: ./regressions
      - name: G - coop difficulty damage HUD
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: G }
        run: ./regressions
      - name: H - durable migration and difficulty
        working-directory: ${{ runner.temp }}/sf-reg
        env: { SF_DIAG_STOP: H }
        run: ./regressions
