plugins {
    id 'com.android.application'
}

android {
    namespace 'com.greenpower2669.spacefortressvs'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.greenpower2669.spacefortressvs'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0-modern'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [file("${rootProject.projectDir}/../third_party/SDL/android-project/app/src/main/java")]
            assets.srcDirs = [file("${buildDir}/generated/gameAssets")]
        }
    }

    androidResources {
        noCompress += ['png', 'tif', 'ogg', 'mp3', 'wav']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

def syncGameAssets = tasks.register('syncGameAssets', Sync) {
    from(file("${rootProject.projectDir}/../assets"))
    into(file("${buildDir}/generated/gameAssets/resources/assets"))
}

tasks.named('preBuild').configure {
    dependsOn(syncGameAssets)
}
