plugins {
    id 'com.android.application'
}

def gameVersion = new Properties()
file("${rootProject.projectDir}/version.properties").withInputStream { gameVersion.load(it) }

def hallApiKey = System.getenv('SPACEFORTRESS_HOF_API_KEY') ?: ''
def javaStringLiteral = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r') + '"'
}

android {
    namespace 'com.greenpower2669.spacefortressvs'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.greenpower2669.spacefortressvs'
        minSdk 23
        targetSdk 36
        versionCode gameVersion.getProperty('VERSION_CODE').toInteger()
        versionName gameVersion.getProperty('VERSION_NAME')
        buildConfigField 'String', 'HOF_API_KEY', javaStringLiteral(hallApiKey)

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [file("${rootProject.projectDir}/../third_party/SDL/android-project/app/src/main/java")]
            assets.srcDirs = [file("${buildDir}/generated/gameAssets")]
        }
    }

    androidResources {
        noCompress += ['png', 'jpg', 'jpeg', 'tif', 'ogg', 'mp3', 'wav']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Prepare and validate actual PNG bytes, not just their base64 transport.
// Exact known-broken art uses a verified original; new corruption fails CI.
def generatedGameAssets = file("${buildDir}/generated/gameAssets")
def assetScript = file("${rootProject.projectDir}/../scripts/prepare-assets.py")
def syncGameAssets = tasks.register('syncGameAssets', Exec) {
    inputs.dir(file("${rootProject.projectDir}/../assets"))
    inputs.file(assetScript)
    outputs.dir(generatedGameAssets)
    doFirst {
        delete(generatedGameAssets)
    }
    commandLine 'python3', assetScript.absolutePath, '--output',
        new File(generatedGameAssets, 'resources/assets').absolutePath
}

tasks.named('preBuild').configure {
    dependsOn(syncGameAssets)
}
