import java.util.Base64

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.greenpower2669.spacefortressvs'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.greenpower2669.spacefortressvs'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0-modern'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [file("${rootProject.projectDir}/../third_party/SDL/android-project/app/src/main/java")]
            assets.srcDirs = [file("${buildDir}/generated/gameAssets")]
        }
    }

    androidResources {
        noCompress += ['png', 'jpg', 'jpeg', 'tif', 'ogg', 'mp3', 'wav']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// The remaster art is stored as three small base64 text chunks so the GitHub
// connector can keep the generated binary art reproducible in the repository.
// Rebuild the ZIP locally inside Gradle before syncing Android assets.
def remasterChunks = fileTree(file("${rootProject.projectDir}/../assets")) {
    include 'remaster_pack.b64.*'
}
def remasterZip = file("${buildDir}/generated/remaster/remaster_pack.zip")

def prepareRemasterPack = tasks.register('prepareRemasterPack') {
    inputs.files(remasterChunks)
    outputs.file(remasterZip)

    doLast {
        def ordered = remasterChunks.files.sort { a, b -> a.name <=> b.name }
        def encoded = ordered.collect { it.getText('UTF-8').trim() }.join('')
        remasterZip.parentFile.mkdirs()
        remasterZip.bytes = Base64.decoder.decode(encoded)
    }
}

def syncGameAssets = tasks.register('syncGameAssets', Sync) {
    dependsOn(prepareRemasterPack)

    // Historical assets keep their original layout.
    from(file("${rootProject.projectDir}/../assets")) {
        exclude 'remaster_pack.b64.*'
    }

    // ZIP paths start at pict/remaster/.
    from({ zipTree(remasterZip) })

    into(file("${buildDir}/generated/gameAssets/resources/assets"))
}

tasks.named('preBuild').configure {
    dependsOn(syncGameAssets)
}
